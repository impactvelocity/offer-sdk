<style>
/* ==========================================================================
   Offer SDK app kit — the offer-app dashboard (dark theme), rebuilt for video.
   Values are copied from offer-app/src/app/globals.css (data-theme="dark") and
   measured from the real screens in capture/assets/app/*.png.

   HOW TO USE IN A FRAME
   1. Paste this whole file inside the style block that lives inside your frame template.
      (Template transport: styles must live inside the frame template.)
   2. Build the window from shell.html. Author it at its LOGICAL size
      (.ak-window is 1366×800 — a real laptop viewport, real 14px UI text) and
      scale the wrapper with GSAP (scale ≈ 1.08–1.12 to fill the top 83%;
      punch in to 1.5–1.9 on the region the VO is talking about).
   3. Copy icons from icons.html (Lucide, the icon set the app uses).
   All classes are prefixed ak- so they never collide with frame-local names.
   ========================================================================== */

@font-face { font-family: "Cal Sans"; src: url("assets/fonts/CalSansVF.woff2") format("woff2"); font-weight: 400 700; font-display: block; }
@font-face { font-family: "Geist Mono"; src: url("assets/fonts/geist-mono-latin.woff2") format("woff2"); font-weight: 400 600; font-display: block; }

.ak {
  --canvas: #0f0f11; --panel: #161618; --bg: #18181b; --bg-subtle: #1c1c1f; --bg-muted: #222226;
  --bg-hover: #27272c; --bg-active: #2e2e34; --bg-elevated: #202024; --bg-inverse: #f1f1f3;
  --fg: #ececee; --fg-secondary: rgb(236 236 238 / .93); --fg-tertiary: rgb(236 236 238 / .86);
  --fg-muted: rgb(236 236 238 / .68); --fg-placeholder: #6f7178; --fg-icon: #9c9ea5;
  --border: #2a2a2f; --border-strong: #37373d; --border-input: #323238;
  --accent: #34d599; --accent-hover: #5ce0b0; --accent-subtle: rgb(52 213 153 / .13); --accent-fg: #5fe3b1; --accent-contrast: #03140c; --ring: rgb(52 213 153 / .4);
  --btn-neon-bg: rgb(52 213 153 / .08); --shadow-brand: inset 0 0 0 1px rgb(52 213 153 / .85), inset 0 0 14px -6px rgb(52 213 153 / .35), 0 0 16px -6px rgb(52 213 153 / .4);
  --brand-vertical: linear-gradient(180deg, #4fe0b0, #2fc48c);
  --success: #30a46c; --success-subtle: rgb(48 164 108 / .16); --success-fg: #5ed29a;
  --danger: #e5484d; --danger-subtle: rgb(229 72 77 / .15); --danger-fg: #ff8a8d;
  --warning: #f0a020; --warning-subtle: rgb(240 160 32 / .14); --warning-fg: #ffc35f;
  --brand-from: #34d599; --brand-to: #2cc0de; --brand-gradient: linear-gradient(90deg, #34d599, #2cc0de);
  --code-comment: #7f828a; --code-keyword: #5fe3b1; --code-string: #6fd69f; --code-key: #93b8ff; --code-number: #ffa072;
  --zapier: #ff5f1f; --paypal: #0070e0;
  --shadow-soft: 0 14px 36px -14px rgb(0 0 0 / .75), 0 2px 8px -2px rgb(0 0 0 / .45);
  --shadow-lg: 0 18px 44px -10px rgb(0 0 0 / .7), 0 4px 12px -4px rgb(0 0 0 / .5);
  font-family: "Cal Sans", ui-sans-serif, system-ui, sans-serif;
  font-variation-settings: "GEOM" 25;           /* the app's UI geometry */
  color: var(--fg); -webkit-font-smoothing: antialiased; font-size: 14px; line-height: 1.4;
}
.ak * { box-sizing: border-box; }
.ak .ak-display { font-variation-settings: "GEOM" 50; letter-spacing: -0.01em; }
/* Neon-style eyebrow: small mono caps (site + app section kickers). */
.ak .ak-eyebrow { font-family: "Geist Mono", monospace; font-variation-settings: normal; font-size: 11px; line-height: 16px; font-weight: 500; letter-spacing: .08em; text-transform: uppercase; color: var(--fg-muted); }
.ak .ak-mono, .ak code { font-family: "Geist Mono", ui-monospace, monospace; font-variation-settings: normal; }
.ak svg { display: block; flex-shrink: 0; }

/* ---------- window + shell ---------- */
.ak-window { position: absolute; width: 1366px; height: 800px; background: var(--canvas); border-radius: 18px;
  border: 1px solid var(--border); box-shadow: 0 40px 120px -30px rgb(0 0 0 / .9), 0 0 0 1px rgb(255 255 255 / .03);
  overflow: hidden; display: flex; padding: 6px 6px 6px 0; transform-origin: 50% 50%; }
.ak-rail { width: 52px; flex-shrink: 0; display: flex; flex-direction: column; align-items: center; gap: 10px; padding-top: 8px; }
.ak-rail .ak-rail-logo { width: 30px; height: 30px; border-radius: 8px; display: grid; place-items: center; color: var(--fg); }
.ak-rail .ak-rail-logo svg { width: 18px; height: 18px; }
.ak-rail .ak-rail-sep { width: 22px; height: 1px; background: var(--border); }
.ak-rail .ak-app-tile { width: 28px; height: 28px; border-radius: 7px; display: grid; place-items: center; font-size: 11px; font-weight: 600; color: var(--accent-contrast);
  background: var(--brand-vertical); }
.ak-rail .ak-app-tile.is-active { box-shadow: 0 0 0 2px var(--canvas), 0 0 0 3.5px var(--accent); }
.ak-rail .ak-app-tile.alt { opacity: .8; }
.ak-rail .ak-rail-plus { color: var(--fg-icon); width: 16px; height: 16px; }
.ak-rail .ak-rail-foot { margin-top: auto; padding-bottom: 6px; display: flex; flex-direction: column; align-items: center; gap: 14px; color: var(--fg-icon); }
.ak-rail .ak-rail-foot svg { width: 15px; height: 15px; }
.ak-rail .ak-avatar { width: 26px; height: 26px; border-radius: 50%; background: var(--bg-muted); color: var(--fg-secondary); font-size: 10px; display: grid; place-items: center; }

.ak-nav { width: 222px; flex-shrink: 0; background: var(--panel); border: 1px solid var(--border); border-radius: 12px;
  margin-right: 6px; display: flex; flex-direction: column; padding: 12px 10px; box-shadow: var(--shadow-soft); }
.ak-nav-title { font-size: 15px; font-weight: 600; padding: 2px 6px 10px; font-variation-settings: "GEOM" 50; }
.ak-quick { height: 30px; border: 1px solid var(--border-input); border-radius: 8px; display: flex; align-items: center; gap: 8px; padding: 0 8px;
  color: var(--fg-muted); font-size: 13px; margin-bottom: 10px; }
.ak-quick svg { width: 14px; height: 14px; color: var(--fg-icon); }
.ak-quick .ak-kbd { margin-left: auto; font-size: 10.5px; border: 1px solid var(--border); border-radius: 4px; padding: 0 4px; color: var(--fg-placeholder); }
.ak-nav-group { display: flex; flex-direction: column; gap: 1px; padding: 6px 0; border-top: 1px solid var(--border); }
.ak-nav-group:first-of-type { border-top: 0; padding-top: 0; }
.ak-nav-item { height: 31px; border-radius: 7px; display: flex; align-items: center; gap: 10px; padding: 0 8px; font-size: 13.5px; color: var(--fg-secondary); }
.ak-nav-item svg { width: 15px; height: 15px; color: var(--fg-icon); }
.ak-nav-item .ak-count { margin-left: auto; font-size: 12px; color: var(--fg-muted); font-variant-numeric: tabular-nums; }
.ak-nav-item.is-active { background: var(--accent-subtle); color: var(--accent-fg); }
.ak-nav-item.is-active svg { color: var(--accent-fg); }
.ak-nav-foot { margin-top: auto; }

.ak-main { flex: 1; min-width: 0; background: var(--bg); border: 1px solid var(--border); border-radius: 12px; display: flex; flex-direction: column;
  overflow: hidden; box-shadow: var(--shadow-soft); position: relative; }
.ak-header { height: 50px; flex-shrink: 0; border-bottom: 1px solid var(--border); display: flex; align-items: center; gap: 10px; padding: 0 12px 0 16px; }
.ak-header .ak-crumb { display: flex; align-items: center; gap: 9px; font-size: 14px; font-weight: 500; }
.ak-header .ak-crumb svg { width: 15px; height: 15px; color: var(--fg-icon); }
.ak-header .ak-crumb .ak-sep { color: var(--fg-placeholder); }
.ak-header .ak-actions { margin-left: auto; display: flex; align-items: center; gap: 4px; }
.ak-toolbar { height: 50px; flex-shrink: 0; display: flex; align-items: center; gap: 10px; padding: 0 16px; border-bottom: 1px solid var(--border); }
.ak-body { flex: 1; min-height: 0; position: relative; overflow: hidden; }
.ak-page { padding: 28px 40px; }
.ak-page-title { font-size: 22px; font-weight: 600; font-variation-settings: "GEOM" 50; letter-spacing: -0.01em; }
.ak-page-sub { color: var(--fg-muted); font-size: 13.5px; margin-top: 4px; }

/* ---------- controls ---------- */
.ak-btn { height: 30px; border-radius: 8px; display: inline-flex; align-items: center; gap: 7px; padding: 0 10px; font-size: 13.5px; color: var(--fg-secondary);
  border: 1px solid transparent; white-space: nowrap; }
.ak-btn svg { width: 14px; height: 14px; }
.ak-btn.is-outline { border-color: var(--border-strong); background: var(--bg-subtle); }
/* Primary = the app's neon button: hairline neon border, faint green wash, green ink. */
.ak-btn.is-primary { background: var(--btn-neon-bg); color: var(--accent-fg); font-weight: 500; box-shadow: var(--shadow-brand); }
.ak-btn.is-gradient { background: var(--btn-neon-bg); color: var(--accent-fg); font-weight: 500; box-shadow: var(--shadow-brand), 0 0 32px -8px rgb(52 213 153 / .55); }
.ak-btn.is-solid { background: var(--brand-vertical); color: var(--accent-contrast); font-weight: 600; }
.ak-btn.is-paypal { background: #ffc439; color: #111; font-weight: 600; }
.ak-btn.is-lg { height: 40px; padding: 0 16px; font-size: 15px; border-radius: 10px; }
.ak-input { height: 32px; border: 1px solid var(--border-input); background: var(--bg-subtle); border-radius: 8px; display: flex; align-items: center; gap: 8px;
  padding: 0 10px; font-size: 13.5px; color: var(--fg); }
.ak-input.is-placeholder { color: var(--fg-placeholder); }
.ak-input.is-focus { border-color: var(--accent); box-shadow: 0 0 0 3px var(--ring); }
.ak-input svg { width: 14px; height: 14px; color: var(--fg-icon); }
.ak-label { font-size: 13px; color: var(--fg-secondary); font-weight: 500; margin-bottom: 6px; }
.ak-seg { display: inline-flex; background: var(--bg-muted); border-radius: 8px; padding: 2px; gap: 2px; }
.ak-seg > span { height: 26px; padding: 0 10px; border-radius: 6px; display: inline-flex; align-items: center; font-size: 13px; color: var(--fg-muted); }
.ak-seg > span.is-on { background: var(--bg-active); color: var(--fg); }
.ak-switch { width: 30px; height: 18px; border-radius: 9px; background: var(--bg-active); position: relative; flex-shrink: 0; }
.ak-switch::after { content: ""; position: absolute; top: 2px; left: 2px; width: 14px; height: 14px; border-radius: 50%; background: #fff; }
.ak-switch.is-on { background: var(--accent); }
.ak-switch.is-on::after { background: var(--accent-contrast); }
.ak-switch.is-on::after { left: 14px; }
.ak-check { width: 16px; height: 16px; border-radius: 4px; border: 1px solid var(--border-strong); display: grid; place-items: center; }
.ak-check.is-on { background: var(--accent); border-color: var(--accent); color: var(--accent-contrast); }
.ak-check svg { width: 11px; height: 11px; }

/* ---------- table (Plans / Entitlements / Add-ons / Incentives / Accounts) ---------- */
.ak-table { width: 100%; border-collapse: collapse; font-size: 13.5px; }
.ak-table th { height: 42px; text-align: left; font-weight: 400; color: var(--fg-muted); padding: 0 14px; border-bottom: 1px solid var(--border); border-right: 1px solid var(--border); white-space: nowrap; }
.ak-table th:last-child, .ak-table td:last-child { border-right: 0; }
.ak-table th .ak-th { display: inline-flex; align-items: center; gap: 7px; }
.ak-table th svg { width: 13px; height: 13px; color: var(--fg-icon); }
.ak-table td { height: 46px; padding: 0 14px; border-bottom: 1px solid var(--border); border-right: 1px solid var(--border); white-space: nowrap; color: var(--fg-secondary); }
.ak-table td.is-num { text-align: right; font-variant-numeric: tabular-nums; }
.ak-table .ak-row-name { display: flex; align-items: center; gap: 9px; color: var(--fg); }
.ak-table .ak-row-icon { width: 22px; height: 22px; border-radius: 6px; background: rgb(59 123 246 / .18); color: #93b8ff; display: grid; place-items: center; }
.ak-table .ak-row-icon svg { width: 13px; height: 13px; }
.ak-table tr.is-hl td { background: rgb(52 213 153 / .07); }
.ak-table-foot { padding: 12px 16px; color: var(--fg-muted); font-size: 13px; }

/* ---------- chips + tags ---------- */
.ak-id { font-family: "Geist Mono", monospace; font-variation-settings: normal; font-size: 12px; background: var(--bg-muted); color: var(--fg-secondary);
  border-radius: 5px; padding: 2px 6px; }
.ak-tag { display: inline-flex; align-items: center; gap: 5px; height: 21px; padding: 0 7px; border-radius: 5px; font-size: 12px; white-space: nowrap;
  background: rgb(255 255 255 / .08); color: #c6c7cc; }
.ak-tag svg { width: 11px; height: 11px; }
.ak-tag.blue { background: rgb(59 123 246 / .18); color: #93b8ff; }
.ak-tag.green { background: rgb(48 164 108 / .18); color: #6fd69f; }
.ak-tag.yellow { background: rgb(240 180 40 / .16); color: #f5c451; }
.ak-tag.orange { background: rgb(235 104 52 / .18); color: #ffa072; }
.ak-tag.red { background: rgb(229 72 77 / .18); color: #ff8a8d; }
.ak-tag.purple { background: rgb(143 107 255 / .2); color: #bba6ff; }
.ak-tag.brand { background: rgb(52 213 153 / .14); color: #5fe3b1; }
.ak-tag.pink { background: rgb(224 69 123 / .18); color: #ff8fba; }
.ak-tag.teal { background: rgb(20 163 157 / .18); color: #62d6cf; }
.ak-more { color: var(--fg-muted); font-size: 12px; }

/* ---------- cards, stats, meters ---------- */
.ak-card { background: var(--bg); border: 1px solid var(--border); border-radius: 12px; }
.ak-card-head { height: 46px; display: flex; align-items: center; padding: 0 16px; border-bottom: 1px solid var(--border); font-weight: 500; font-size: 14px; }
.ak-card-body { padding: 16px; }
.ak-elevated { background: var(--bg-elevated); border: 1px solid var(--border-strong); border-radius: 12px; box-shadow: var(--shadow-lg); }
.ak-stat-strip { display: grid; grid-template-columns: repeat(4, 1fr); border: 1px solid var(--border); border-radius: 12px; overflow: hidden; }
.ak-stat { padding: 16px 18px; border-right: 1px solid var(--border); }
.ak-stat:last-child { border-right: 0; }
.ak-stat-label { display: flex; align-items: center; gap: 7px; font-size: 13px; color: var(--fg-secondary); }
.ak-stat-label svg { width: 13px; height: 13px; color: var(--fg-icon); }
.ak-stat-value { font-size: 26px; font-weight: 600; margin-top: 8px; font-variant-numeric: tabular-nums; font-variation-settings: "GEOM" 50; }
.ak-stat-sub { font-size: 12px; color: var(--fg-muted); margin-top: 4px; }
.ak-meter { height: 8px; border-radius: 4px; background: var(--bg-active); overflow: hidden; }
.ak-meter > i { display: block; height: 100%; width: 0; border-radius: 4px; background: var(--brand-gradient); }
.ak-meter.is-warn > i { background: linear-gradient(90deg, #f0a020, #e5484d); }
.ak-bar-row { position: relative; height: 30px; border-radius: 6px; display: flex; align-items: center; padding: 0 10px; font-size: 13.5px; }
.ak-bar-row > b { position: absolute; inset: 0 auto 0 0; border-radius: 6px; background: linear-gradient(90deg, rgb(52 213 153 / .32), rgb(44 192 222 / .22)); font-weight: 400; }
.ak-bar-row > span { position: relative; }
.ak-bar-row > .ak-bar-val { margin-left: auto; color: var(--fg-secondary); font-variant-numeric: tabular-nums; }

/* ---------- code block (site CodeBlock look) ---------- */
.ak-code { background: #131315; border: 1px solid var(--border); border-radius: 14px; overflow: hidden; box-shadow: var(--shadow-lg); }
.ak-code-bar { height: 40px; display: flex; align-items: center; gap: 8px; padding: 0 14px; border-bottom: 1px solid var(--border); color: var(--fg-muted); font-size: 13px; }
.ak-code-bar .ak-dots { display: flex; gap: 6px; margin-right: 6px; }
.ak-code-bar .ak-dots i { width: 10px; height: 10px; border-radius: 50%; background: var(--bg-active); }
.ak-code pre { margin: 0; padding: 18px 20px; font-family: "Geist Mono", monospace; font-variation-settings: normal; font-size: 15px; line-height: 1.65; color: var(--fg-secondary); white-space: pre; }
.ak-code .k { color: var(--code-keyword); } .ak-code .s { color: var(--code-string); } .ak-code .p { color: var(--code-key); }
.ak-code .n { color: var(--code-number); } .ak-code .c { color: var(--code-comment); } .ak-code .f { color: #ececee; }
.ak-code .del { background: rgb(229 72 77 / .14); } .ak-code .add { background: rgb(48 164 108 / .14); }

/* ---------- feedback ---------- */
.ak-toast { position: absolute; display: flex; align-items: center; gap: 10px; padding: 10px 14px; border-radius: 10px; background: var(--bg-elevated);
  border: 1px solid var(--border-strong); box-shadow: var(--shadow-lg); font-size: 13.5px; white-space: nowrap; }
.ak-toast svg { width: 15px; height: 15px; }
.ak-toast.is-ok svg { color: var(--success-fg); }
.ak-toast.is-warn svg { color: var(--warning-fg); }
.ak-toast.is-bad svg { color: var(--danger-fg); }
.ak-dot { width: 7px; height: 7px; border-radius: 50%; background: var(--success); display: inline-block; }
.ak-dot.is-warn { background: var(--warning); } .ak-dot.is-bad { background: var(--danger); }
.ak-cursor { position: absolute; width: 22px; height: 22px; z-index: 50; pointer-events: none; filter: drop-shadow(0 2px 4px rgb(0 0 0 / .6)); }
.ak-ripple { position: absolute; width: 36px; height: 36px; margin: -18px 0 0 -18px; border-radius: 50%; border: 2px solid var(--accent-fg); z-index: 49; opacity: 0; }

/* ---------- avatars + misc ---------- */
.ak-av { width: 22px; height: 22px; border-radius: 6px; display: grid; place-items: center; font-size: 9.5px; font-weight: 600; background: rgb(52 213 153 / .14); color: #5fe3b1; }
.ak-av.round { border-radius: 50%; }
.ak-kv { display: flex; justify-content: space-between; font-size: 13px; padding: 7px 0; border-bottom: 1px solid var(--border); color: var(--fg-muted); }
.ak-kv b { font-weight: 400; color: var(--fg); }
.ak-divider { height: 1px; background: var(--border); }

/* ======================= 16-agent-save — frame styles (neon) ======================= */
#root { position: absolute; inset: 0; width: 1920px; height: 1080px; overflow: hidden; }
.f16as-bg { position: absolute; inset: 0; background: #0f0f11; }
.f16as-scene { position: absolute; inset: 0; }
.f16as-cam { position: absolute; inset: 0; transform-origin: 580px 456px; }
/* logical stage 1186×520, scaled 1.5 → 1779×780 on screen (never animated) */
.f16as-stage { position: absolute; left: 70px; top: 66px; width: 1186px; height: 520px; transform: scale(1.5); transform-origin: 0 0; }

/* glow-flash layer: sits on a chip/button, flashed 0 → 1 → 0 */
.f16as-fx { position: absolute; inset: -1px; border-radius: inherit; pointer-events: none; opacity: 0; z-index: 3;
  box-shadow: inset 0 0 0 1px rgb(52 213 153 / .95), 0 0 18px 2px rgb(52 213 153 / .55); }
.f16as-fx.is-red { box-shadow: inset 0 0 0 1px rgb(255 138 141 / .9), 0 0 16px 1px rgb(229 72 77 / .5); }

  border-radius: 14px; overflow: hidden; box-shadow: 0 40px 120px -30px rgb(0 0 0 / .9), 0 0 0 1px rgb(255 255 255 / .03); }

  background: var(--brand-vertical); }

.f16as-ptitle { position: absolute; left: 24px; top: 96px; font-size: 18px; font-weight: 600; letter-spacing: -0.01em; }
.f16as-billing { position: absolute; left: 24px; top: 134px; width: 632px; padding: 18px 20px; background: var(--bg-subtle); }
.f16as-row { display: flex; align-items: baseline; justify-content: space-between; }
.f16as-plan { font-size: 16px; font-weight: 500; }
.f16as-price { font-size: 16px; font-weight: 500; font-variant-numeric: tabular-nums; }
.f16as-usage { display: flex; gap: 30px; margin-top: 14px; padding-top: 16px; border-top: 1px solid var(--border); }

.f16as-meterlabel { display: flex; justify-content: space-between; font-size: 13.5px; color: var(--fg-secondary); margin-bottom: 10px; }

.f16as-stage .ak-meter { height: 10px; border-radius: 5px; }

            <i class="f16as-fx" id="f16as-pick-fx" style="border-radius:9px"></i>
          </div>

          <div class="ak-eyebrow f16as-sect" id="f16as-sect-guard">Guardrails</div>
          <div class="f16as-pills">
            <div class="f16as-gpill"><i class="f16as-hl"></i><span class="f16as-gtx">Max 40%</span><i class="f16as-fx"></i></div>
            <div class="f16as-gpill"><i class="f16as-hl"></i><span class="f16as-gtx">Credits</span><svg class="f16as-gck" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"><path d="M20 6 9 17l-5-5"/></svg><i class="f16as-fx"></i></div>
            <div class="f16as-gpill"><i class="f16as-hl"></i><span class="f16as-gtx">Pause</span><svg class="f16as-gck" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"><path d="M20 6 9 17l-5-5"/></svg><i class="f16as-fx"></i></div>
          </div>
        </div>
      </div>

      <!-- cursor + click ripples (stage coordinates) -->
      <div class="ak-ripple" id="f16as-rip0"></div>
      <div class="ak-ripple" id="f16as-rip1"></div>
      <div class="ak-ripple" id="f16as-rip2"></div>
      <div class="ak-ripple" id="f16as-rip3"></div>
      <svg class="ak-cursor f16as-cursor" id="f16as-cursor" viewBox="0 0 24 24"><path d="M4 2.5 L4 19 L8.6 14.8 L11.6 21.5 L14.4 20.3 L11.5 13.7 L17.8 13.4 Z" fill="#fff" stroke="#111" stroke-width="1.3" stroke-linejoin="round"/></svg>
    </div>
  </div>
</div>

<script src="https://cdn.jsdelivr.net/npm/gsap@3.14.2/dist/gsap.min.js"></script>
<script>
(function () {
  window.__timelines = window.__timelines || {};
  var tl = gsap.timeline({ paused: true });
  var X = "expo.out", IO = "power3.inOut";

  // click targets in stage coordinates (logical 1186×520 stage)
  var P = {
    enter:    [610, 480],
    cancel:   [550, 376],
    answer:   [300, 260],
    cont:     [474, 397],
    obtn:     [352, 306]
  };
  function cur(p) { return { x: p[0] - 4, y: p[1] - 2 }; }   // cursor tip sits ~(4,2) inside its box
  function fmt(n) { n = Math.round(n); return n >= 1000 ? Math.floor(n / 1000) + "," + String(n % 1000).padStart(3, "0") : String(n); }
  function flash(el, t) {
    tl.fromTo(el, { opacity: 0 }, { opacity: 1, duration: 0.1, ease: "power2.out" }, t);
    tl.to(el, { opacity: 0, duration: 0.5, ease: "power2.out" }, t + 0.1);
  }
  function pop(el, t, from, fx) {
    tl.fromTo(el, { opacity: 0, scale: from }, { opacity: 1, scale: 1, duration: 0.4, ease: X }, t);
    if (fx) flash(fx, t + 0.03);
  }
  function click(t, p, rip, target, fx) {
    tl.to("#f16as-cursor", { scale: 0.84, duration: 0.07, ease: "power2.out" }, t);
    tl.to("#f16as-cursor", { scale: 1, duration: 0.22, ease: X }, t + 0.07);
    tl.fromTo(rip, { x: p[0], y: p[1], scale: 0.4, opacity: 0 }, { x: p[0], y: p[1], scale: 0.9, opacity: 0.95, duration: 0.08, ease: "power2.out" }, t + 0.01);
    tl.to(rip, { scale: 1.9, opacity: 0, duration: 0.4, ease: "power2.out" }, t + 0.09);
    if (target) {
      tl.to(target, { scale: 0.96, duration: 0.07, ease: "power2.out" }, t);
      tl.to(target, { scale: 1, duration: 0.26, ease: X }, t + 0.07);
    }
    if (fx) flash(fx, t + 0.03);
  }

  // ---- Camera: slow push on Tom's app, then one glide left as the agent trace arrives ("agent")
  tl.fromTo("#f16as-cam", { x: 380, scale: 1.04 }, { x: 380, scale: 1.08, duration: 4.36, ease: "power1.inOut" }, 0);
  tl.to("#f16as-cam", { x: 0, scale: 1, duration: 0.85, ease: IO }, 4.4);

  // ---- Beat 1: Tom at his credit limit, three months running
  tl.fromTo("#f16as-win", { opacity: 0, y: 24, scale: 0.985 }, { opacity: 1, y: 0, scale: 1, duration: 0.5, ease: X }, 0.04);
  gsap.utils.toArray("#f16as-scene .f16as-in").forEach(function (el, k) {
    tl.fromTo(el, { opacity: 0, y: 12 }, { opacity: 1, y: 0, duration: 0.45, ease: X }, 0.1 + k * 0.06);
  });
  var usedEl = document.getElementById("f16as-used"), used = { v: 0 };
  tl.fromTo("#f16as-meterfill", { scaleX: 0 }, { scaleX: 1, duration: 0.95, ease: "power2.inOut" }, 0.35);           // "hit his credit limit"
  tl.fromTo(used, { v: 0 }, { v: 2500, duration: 0.95, ease: "power2.inOut",
    onUpdate: function () { usedEl.textContent = fmt(used.v); } }, 0.35);
  pop("#f16as-limit", 1.24, 0.85, "#f16as-limit-fx");                                                                // "limit"
  [1.5, 1.72, 1.98].forEach(function (t, k) {                                                                        // "three months running"
    tl.fromTo("#f16as-fill" + k, { scaleY: 0 }, { scaleY: 1, duration: 0.34, ease: X }, t);
  });

  // ---- Beat 2: clicks cancel
  var c0 = cur(P.enter), c1 = cur(P.cancel);
  tl.fromTo("#f16as-cursor", { x: c0.x, y: c0.y, opacity: 0 }, { x: c1.x, y: c1.y, opacity: 1, duration: 0.55, ease: X }, 2.08);
  click(2.68, P.cancel, "#f16as-rip0", "#f16as-cancelbtn", null);                                                     // "clicked"

  // ---- Beat 3: cancel flow pops, "running out of credits" picked fast, Continue → passed to the agent
  tl.fromTo("#f16as-scrim", { opacity: 0 }, { opacity: 1, duration: 0.3, ease: "power2.out" }, 2.9);
  tl.fromTo("#f16as-modal", { opacity: 0, scale: 0.86, y: 10 }, { opacity: 1, scale: 1, y: 0, duration: 0.45, ease: X }, 2.94);
  gsap.utils.toArray("#f16as-scene .f16as-ansrow").forEach(function (el, k) {
    tl.fromTo(el, { opacity: 0, y: 8 }, { opacity: 1, y: 0, duration: 0.35, ease: X }, 3.02 + k * 0.05);
  });
  tl.to("#f16as-cursor", { x: cur(P.answer).x, y: cur(P.answer).y, duration: 0.42, ease: IO }, 3.22);
  click(3.66, P.answer, "#f16as-rip1", "#f16as-ans-pick", null);
  tl.fromTo("#f16as-sel", { opacity: 0 }, { opacity: 1, duration: 0.2, ease: "power2.out" }, 3.68);
  pop("#f16as-selcheck", 3.7, 0.5, null);
  tl.fromTo("#f16as-continue", { opacity: 0.45 }, { opacity: 1, duration: 0.2, ease: "power2.out" }, 3.74);
  tl.to("#f16as-cursor", { x: cur(P.cont).x, y: cur(P.cont).y, duration: 0.34, ease: IO }, 3.82);
  click(4.2, P.cont, "#f16as-rip2", "#f16as-continue", "#f16as-continue-fx");                                         // "passed him"
  tl.to("#f16as-cursor", { x: cur(P.cont).x + 34, y: cur(P.cont).y + 56, duration: 0.6, ease: "power3.out" }, 4.42);
  tl.fromTo("#f16as-step2bar", { scaleX: 0 }, { scaleX: 1, duration: 0.4, ease: X }, 4.26);
  tl.to("#f16as-mbody", { opacity: 0.45, duration: 0.3, ease: "power2.out" }, 4.28);

  // ---- Beat 4: agent trace slides in ("agent"), three steps tick fast
  tl.fromTo("#f16as-trace", { opacity: 0, x: 70 }, { opacity: 1, x: 0, duration: 0.55, ease: X }, 4.62);
  pop("#f16as-pill-work", 4.78, 0.85, null);
  [4.8, 4.94, 5.08].forEach(function (t, k) {
    tl.fromTo("#f16as-step" + k, { opacity: 0, y: 8 }, { opacity: 1, y: 0, duration: 0.35, ease: X }, t);
    tl.fromTo("#f16as-spin" + k, { rotation: 0, opacity: 1 }, { rotation: 360, duration: 0.2, ease: "none" }, t);
    tl.to("#f16as-spin" + k, { opacity: 0, duration: 0.05 }, t + 0.2);
    tl.fromTo("#f16as-done" + k, { opacity: 0, scale: 0.5 }, { opacity: 1, scale: 1, duration: 0.35, ease: X }, t + 0.2);
    tl.fromTo("#f16as-meta" + k, { opacity: 0, x: -6 }, { opacity: 1, x: 0, duration: 0.35, ease: X }, t + 0.22);
  });

  // ---- Beat 5: "skipped the discount" — the -40% ghost is struck out
  tl.fromTo("#f16as-sect-offer", { opacity: 0 }, { opacity: 1, duration: 0.3, ease: "power2.out" }, 5.2);
  tl.fromTo("#f16as-ghost", { opacity: 0, y: 8 }, { opacity: 1, y: 0, duration: 0.35, ease: X }, 5.22);
  tl.fromTo("#f16as-strike", { scaleX: 0 }, { scaleX: 1, duration: 0.32, ease: IO }, 5.42);
  pop("#f16as-skipped", 5.72, 0.85, null);
  tl.to("#f16as-ghost", { opacity: 0.5, duration: 0.35, ease: "power2.out" }, 5.8);

  // ---- Beat 6: "five thousand credits" — modal swaps to the save offer, count-up, trace logs the pick
  tl.to("#f16as-modal", { opacity: 0, scale: 0.94, duration: 0.22, ease: "power2.in" }, 6.14);
  tl.fromTo("#f16as-glow", { opacity: 0 }, { opacity: 1, duration: 0.8, ease: "power2.out" }, 6.28);
  tl.fromTo("#f16as-offer", { opacity: 0, scale: 0.88, y: 12 }, { opacity: 1, scale: 1, y: 0, duration: 0.5, ease: X }, 6.3);
  gsap.utils.toArray("#f16as-scene .f16as-oi").forEach(function (el, k) {
    tl.fromTo(el, { opacity: 0, y: 10 }, { opacity: 1, y: 0, duration: 0.4, ease: X }, 6.34 + k * 0.05);
  });
  var cntEl = document.getElementById("f16as-ocount"), cnt = { v: 0 };
  tl.fromTo(cnt, { v: 0 }, { v: 5000, duration: 0.42, ease: "power2.out",
    onUpdate: function () { cntEl.textContent = fmt(cnt.v); } }, 6.34);
  pop("#f16as-pick", 6.46, 0.85, "#f16as-pick-fx");
  pop("#f16as-pickok", 6.7, 0.5, null);

  // ---- Beat 7: "same price"
  pop("#f16as-same", 7.48, 0.8, "#f16as-same-fx");

  // ---- Beat 8: "saved the sale" — press, button fills, toast
  tl.to("#f16as-cursor", { x: cur(P.obtn).x, y: cur(P.obtn).y, duration: 0.5, ease: IO }, 7.74);
  click(8.34, P.obtn, "#f16as-rip3", "#f16as-obtn", "#f16as-obtn-fx");
  tl.fromTo("#f16as-obtn-fill", { opacity: 0 }, { opacity: 1, duration: 0.22, ease: "power2.out" }, 8.4);
  tl.to("#f16as-obtn-a", { opacity: 0, y: -8, duration: 0.12, ease: "power2.in" }, 8.38);
  tl.fromTo("#f16as-obtn-b", { opacity: 0, y: 8 }, { opacity: 1, y: 0, duration: 0.32, ease: X }, 8.48);
  tl.to("#f16as-cursor", { x: cur(P.obtn).x + 46, y: cur(P.obtn).y + 34, opacity: 0, duration: 0.4, ease: "power2.out" }, 8.62);
  tl.fromTo("#f16as-toast", { opacity: 0, y: 14, scale: 0.94 }, { opacity: 1, y: 0, scale: 1, duration: 0.45, ease: X }, 8.6);
  tl.to("#f16as-pill-work", { opacity: 0, duration: 0.15 }, 8.6);
  pop("#f16as-pill-done", 8.62, 0.8, null);

  // ---- Beat 9: "inside the limits you set" — guardrail pills arrive, then light up
  tl.fromTo("#f16as-sect-guard", { opacity: 0 }, { opacity: 1, duration: 0.3, ease: "power2.out" }, 9.22);
  var pills = gsap.utils.toArray("#f16as-scene .f16as-gpill");
  pills.forEach(function (el, k) {
    tl.fromTo(el, { opacity: 0, y: 6, scale: 0.9 }, { opacity: 1, y: 0, scale: 1, duration: 0.35, ease: X }, 9.26 + k * 0.05);
    var t = 9.6 + k * 0.07;                                                                                          // "limits"
    tl.fromTo(el.querySelector(".f16as-hl"), { opacity: 0 }, { opacity: 1, duration: 0.3, ease: "power2.out" }, t);
    tl.to(el.querySelector(".f16as-gtx"), { color: "#5fe3b1", duration: 0.3, ease: "power2.out" }, t);
    var ck = el.querySelector(".f16as-gck");
    if (ck) tl.to(ck, { color: "#5fe3b1", duration: 0.3, ease: "power2.out" }, t);
    flash(el.querySelector(".f16as-fx"), t + 0.02);
  });

  // hold the final state to the end of the frame
  tl.to({}, { duration: 0.01 }, 10.63);

  window.__timelines["16-agent-save"] = tl;
})();
</script>
</div>
</template>
