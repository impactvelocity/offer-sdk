<script>
(function () {
  const $ = (id) => document.getElementById("20-cta-" + id);
  const tl = gsap.timeline({ paused: true });
  const DUR = 6.37;

  const bgArt = $("bg-art"), glow = $("glow");
  const lockup = $("lockup"), mark = $("mark");
  const url = $("url"), urlA = $("url-a"), caret = $("caret"), urlLine = $("url-line");
  const words = [$("w1"), $("w2"), $("w3"), $("w4"), $("w5"), $("w6")];
  const btn = $("btn"), halo = $("btn-halo"), fill = $("btn-fill"), arrow = $("arrow");
  const cursor = $("cursor"), ripA = $("ripple-a"), ripB = $("ripple-b");

  // ---------- Backdrop: neon footer line-art, slow camera settle under the whole shot ----------
  tl.fromTo(bgArt, { scale: 1.06, y: 18 }, { scale: 1, y: 0, duration: DUR, ease: "power2.out" }, 0);
  tl.fromTo(bgArt, { opacity: 0.32 }, { opacity: 0.6, duration: 0.7, ease: "power2.out" }, 0);

  // ---------- 0.0 "Go to" — small lockup slides in at the block's top-left + one green glow ----------
  tl.fromTo(glow, { opacity: 0, scale: 0.82 }, { opacity: 1, scale: 1, duration: 0.8, ease: "power3.out" }, 0);
  tl.fromTo(lockup, { opacity: 0, x: -24, filter: "blur(8px)" },
    { opacity: 1, x: 0, filter: "blur(0px)", duration: 0.55, ease: "expo.out" }, 0.02);
  tl.fromTo(mark, { rotation: -14, scale: 0.8 }, { rotation: 0, scale: 1, duration: 0.6, ease: "expo.out" }, 0.02);

  // ---------- 0.35 "offersdk.com" — URL types on fast (bright), caret, underline draws ----------
  const FULL = "offersdk.com";
  const KEYS = [0.36, 0.41, 0.46, 0.51, 0.56, 0.64, 0.69, 0.74, 0.84, 0.90, 0.95, 1.01];
  const TYPED = KEYS[KEYS.length - 1];
  const countAt = (t) => { let n = 0; while (n < KEYS.length && t >= KEYS[n]) n++; return n; };
  const caretAt = (t) => {
    if (t < 0.28 || t >= 1.5) return 0;
    if (t < TYPED + 0.12) return 1;                                        // solid while typing
    return Math.sin((t - TYPED - 0.12) / 0.4 * Math.PI * 2 + Math.PI / 2) > 0 ? 0 : 1;   // deterministic blink
  };
  const driver = { t: 0 };
  tl.to(driver, {
    t: DUR, duration: DUR, ease: "none",
    onUpdate: () => {
      const s = FULL.slice(0, countAt(driver.t));
      if (urlA.textContent !== s) urlA.textContent = s;
      caret.style.opacity = String(caretAt(driver.t));
    }
  }, 0);
  // completion punch (anchored left) + gradient underline draws in
  tl.fromTo(url, { scale: 1.03 }, { scale: 1, duration: 0.45, ease: "expo.out", immediateRender: false }, TYPED);
  tl.fromTo(urlLine, { scaleX: 0, opacity: 1 }, { scaleX: 1, duration: 0.5, ease: "expo.out" }, TYPED + 0.02);

  // ---------- 1.43 "deploy" — neon "Deploy on Render →" rises and ignites ----------
  const RISE = 1.3;
  tl.fromTo(btn, { opacity: 0, y: 46, scale: 0.92 }, { opacity: 1, y: 0, scale: 1, duration: 0.55, ease: "expo.out" }, RISE);
  tl.fromTo(halo, { opacity: 0 }, { opacity: 1, duration: 0.2, ease: "power2.out" }, RISE + 0.1);
  tl.to(halo, { opacity: 0.4, duration: 0.7, ease: "power3.out" }, RISE + 0.3);
  // the glow follows the eye down toward the button
  tl.to(glow, { y: 70, scaleY: 0.86, duration: 0.7, ease: "expo.out" }, RISE);

  // ---------- 1.43 → 3.01 the dimmed lead continues the statement, word by word on the voice ----------
  // each word lands bright as it is spoken, then settles into the dimmed tone of the two-tone statement
  const WORD_AT = [1.38, 1.77, 2.04, 2.22, 2.72, 2.96];   // deploy · your · own · agentic · offer · API
  words.forEach((w, i) => {
    tl.fromTo(w, { opacity: 0, y: 22 }, { opacity: 1, y: 0, duration: 0.42, ease: "expo.out" }, WORD_AT[i]);
    tl.fromTo(w, { color: "#ececee" }, { color: "rgba(236,236,238,0.6)", duration: 0.7, ease: "power2.out" }, WORD_AT[i] + 0.16);
  });

  // ---------- 3.76 "your app" — cursor arrives (decelerating, human aim) ----------
  const TX = 482, TY = 670;
  tl.set(cursor, { opacity: 1 }, 3.56);
  tl.fromTo(cursor, { x: 1960, y: 1000 }, { x: TX, y: TY, duration: 0.82, ease: "power3.out" }, 3.56);

  // ---------- 4.58 "today" — click: lockstep press, ripple, ignite ----------
  const CLICK = 4.5, PRESS = 0.08, UP = CLICK + PRESS;
  tl.to(cursor, { scale: 0.84, duration: PRESS, ease: "power1.in" }, CLICK);
  tl.to(btn, { scale: 0.96, duration: PRESS, ease: "power1.in" }, CLICK);
  tl.to(cursor, { scale: 1, duration: 0.3, ease: "power3.out" }, UP);
  tl.to(btn, { scale: 1, duration: 0.5, ease: "expo.out" }, UP);
  tl.fromTo(arrow, { x: 0 }, { x: 10, duration: 0.5, ease: "expo.out", immediateRender: false }, UP);
  tl.fromTo([ripA, ripB], { scale: 0, opacity: 0.9 },
    { scale: 5, opacity: 0, duration: 0.75, ease: "power2.out", stagger: 0.09, immediateRender: false }, UP - 0.02);
  tl.fromTo(fill, { opacity: 0 }, { opacity: 1, duration: 0.1, ease: "power2.out", immediateRender: false }, UP);
  tl.to(fill, { opacity: 0.45, duration: 0.8, ease: "power3.out" }, UP + 0.1);
  tl.to(halo, { opacity: 1, duration: 0.12, ease: "power2.out" }, UP);
  tl.to(halo, { opacity: 0.6, duration: 0.9, ease: "power3.out" }, UP + 0.12);
  // the footer art lights up with the click, then settles
  tl.to(bgArt, { opacity: 0.78, duration: 0.16, ease: "power2.out" }, UP);
  tl.to(bgArt, { opacity: 0.66, duration: 1.0, ease: "power3.out" }, UP + 0.16);

  // ---------- final settle: cursor eases off the label, everything holds ----------
  tl.to(cursor, { x: TX + 150, y: TY + 86, duration: 0.8, ease: "power2.inOut" }, 4.95);

  window.__timelines = window.__timelines || {};
  window.__timelines["20-cta"] = tl;
})();
