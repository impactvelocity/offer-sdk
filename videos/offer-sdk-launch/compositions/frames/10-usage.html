  <script>
    (function () {
      window.__timelines = window.__timelines || {};
      var DUR = 6.82;
      var tl = gsap.timeline({ paused: true });
      var byId = function (id) { return document.getElementById("10-usage-" + id); };

      var cam = byId("cam"), pan = byId("pan");
      var list = byId("list"), card = byId("card"), glow = byId("glow");
      var chart = byId("chart"), top3 = byId("top");
      var agent = byId("agent"), agentFlash = byId("agentflash"), cardFlash = byId("cardflash");
      var evEl = byId("events"), totalEl = byId("total");
      var aiEl = byId("ai"), aiPct = byId("aipct"), aiFill = byId("aifill");
      var apiEl = byId("api"), apiPct = byId("apipct"), apiFill = byId("apifill"), apiWarn = byId("apiwarn");

      // ---- deterministic data, timed to the cue sheet ----
      // rows stream on "counts every call" (0.43–2.0), keep ticking under the punch,
      // and the agent's three requests land on "APIs" 5.30 / "tools" 5.82 / "AI agents" 6.15.
      var ARR = [[0.36,1],[0.62,3],[0.88,2],[1.1,1],[1.34,5],[1.58,1],[1.82,4],[2.06,2],[2.3,3],[3.95,1],[4.55,1],[5.2,430],[5.7,430],[6.0,440]];
      var EV0 = 8129, TOT0 = 18776, ROW = 56;
      var evInc = ARR.map(function (a, k) { return 1 + ((k * 2) % 3); }); // 1,3,2,1,3,2…
      var AI_T = 2.85, API_T = 3.0, FILL_DUR = 1.1;            // meters fill on "charge by usage"
      var TICKS = [[5.2, 430, 0.5], [5.7, 430, 0.45], [6.0, 440, 0.42]];  // POST /v1/generate ticks

      function clamp(p) { return p < 0 ? 0 : p > 1 ? 1 : p; }
      function p3(p) { p = clamp(p); return 1 - Math.pow(1 - p, 4); }   // == power3.out
      function p4(p) { p = clamp(p); return 1 - Math.pow(1 - p, 5); }   // == power4.out
      function ex(p) { p = clamp(p); return p >= 1 ? 1 : 1 - Math.pow(2, -10 * p); } // == expo.out
      function fmt(n) { return Math.round(n).toLocaleString("en-US"); }
      function mix(a, b, w) { return "rgb(" + Math.round(a[0] + (b[0] - a[0]) * w) + "," + Math.round(a[1] + (b[1] - a[1]) * w) + "," + Math.round(a[2] + (b[2] - a[2]) * w) + ")"; }
      var FG = [236, 236, 238], GREEN = [95, 227, 177], AMBER = [255, 195, 95], MUTED = [171, 171, 173];

      var last = {};
      function put(el, key, txt) { if (last[key] !== txt) { el.textContent = txt; last[key] = txt; } }
      function sty(el, key, prop, v) { if (last[key] !== v) { el.style[prop] = v; last[key] = v; } }

      // Every readout is a pure function of timeline time t (seek-safe).
      function render(t) {
        // Usage events stat: small increments per arriving row, number pops (scale + green flash)
        var ev = EV0, tot = TOT0, since = -1;
        for (var k = 0; k < ARR.length; k++) {
          var d = t - ARR[k][0];
          if (d < 0) continue;
          var p = p3(d / 0.35);
          ev += evInc[k] * p;
          tot += ARR[k][1] * p;
          since = d;
        }
        // feed scroll: each arrival slides the list down one row (expo.out, 0.42s)
        var ly = -ARR.length * ROW;
        for (var q = 0; q < ARR.length; q++) ly += ROW * ex((t - ARR[q][0]) / 0.42);
        sty(list, "ly", "transform", "translate3d(0," + ly.toFixed(2) + "px,0)");
        put(evEl, "ev", fmt(ev));
        put(totalEl, "tot", fmt(tot));
        var pop = since < 0 ? 1 : ex(since / 0.35);
        sty(evEl, "evs", "transform", "scale(" + (0.9 + 0.1 * pop).toFixed(4) + ")");
        sty(evEl, "evc", "color", since < 0 ? "" : mix(GREEN, FG, clamp(since / 0.55)));

        // AI credits meter (counting-dynamic-scale: value + scale share the fill's ease)
        var ap = p4((t - AI_T) / FILL_DUR);
        var ai = 2180 * ap;
        put(aiEl, "ai", fmt(ai));
        put(aiPct, "aip", Math.round(ai / 25) + "%");
        sty(aiFill, "aif", "transform", "scaleX(" + (ai / 2500).toFixed(4) + ")");
        sty(aiEl, "ais", "transform", "scale(" + (0.8 + 0.2 * ap).toFixed(4) + ")");

        // API calls meter: fills to 8,400, then the agent's ticks race it toward the limit
        var bp = p4((t - API_T) / FILL_DUR);
        var api = 8400 * bp, tick = 1;
        for (var i = 0; i < TICKS.length; i++) {
          var dt = t - TICKS[i][0];
          if (dt < 0) continue;
          api += TICKS[i][1] * p3(dt / TICKS[i][2]);
          tick = 0.9 + 0.1 * ex(dt / 0.35);
        }
        put(apiEl, "api", fmt(api));
        put(apiPct, "apip", Math.round(api / 100) + "%");
        var sx = "scaleX(" + (api / 10000).toFixed(4) + ")";
        sty(apiFill, "apif", "transform", sx);
        sty(apiWarn, "apiw", "transform", sx);
        sty(apiEl, "apis", "transform", "scale(" + ((0.8 + 0.2 * bp) * tick).toFixed(4) + ")");
        // the fill turns amber as usage crosses ~94–96.5% of the limit (lands on "AI agents")
        var w = clamp((api - 9400) / 250);
        sty(apiWarn, "apio", "opacity", w.toFixed(3));
        sty(apiEl, "apic", "color", w > 0 ? mix(FG, AMBER, w) : "");
        sty(apiPct, "apipc", "color", w > 0 ? mix(MUTED, AMBER, w) : "");
      }
      // One linear clock drives every readout. A modifier (not onUpdate) so readouts stay correct
      // even when the host seeks with suppressEvents.
      var clock = { t: 0 };
      tl.fromTo(clock, { t: 0 }, { t: DUR, duration: DUR, ease: "none", modifiers: { t: function (v) { render(parseFloat(v) || 0); return v; } } }, 0);
      render(0);

      // ---- camera: window at rest (handoff_in: 960,470 @1.1) → drift → punch onto the usage card ----
      gsap.set(cam, { scale: 1.1 });
      gsap.set(pan, { x: 0, y: 0 });
      tl.fromTo(cam, { scale: 1.1 }, { scale: 1.135, duration: 2.38, ease: "power1.inOut", immediateRender: false }, 0.1);
      tl.fromTo(pan, { x: 0, y: 0 }, { x: -22, y: -8, duration: 2.38, ease: "power1.inOut", immediateRender: false }, 0.1);
      // coordinate-target-zoom (nested wrappers): focus = chips + card, center in cam coords ≈ (894, 470).
      // pan T = (66, -8) puts it at screen (960, ~455). Punch is centered on "charge", lands on "by".
      tl.fromTo(cam, { scale: 1.135 }, { scale: 1.65, duration: 0.76, ease: "expo.inOut", immediateRender: false }, 2.48);
      tl.fromTo(pan, { x: -22, y: -8 }, { x: 66, y: -8, duration: 0.76, ease: "expo.inOut", immediateRender: false }, 2.48);
      tl.fromTo(cam, { scale: 1.65 }, { scale: 1.675, duration: DUR - 3.24, ease: "power1.out", immediateRender: false }, 3.24);

      // ---- chart + sparkline draw in under the crossfade (first motion at 0.04) ----
      tl.fromTo(byId("cliprect"), { attr: { width: 0 } }, { attr: { width: 568 }, duration: 1.0, ease: "power3.out" }, 0.04);
      tl.fromTo(byId("sparkline"), { strokeDashoffset: 1 }, { strokeDashoffset: 0, duration: 0.8, ease: "power3.out" }, 0.08);

      // ---- Scene 1: Recent activity streams in from the top ("counts every call") ----
      // (the list's slide-down is computed in render(): rows arrive faster than a slide lasts,
      //  and summed offsets stay seek-order independent where stacked tweens would not)
      var rows = list.querySelectorAll("[data-arr]"), N = ARR.length; // rows: newest first in the DOM
      for (var k = 1; k <= N; k++) {
        var at = ARR[k - 1][0];
        var r = rows[N - k];
        tl.fromTo(r, { opacity: 0, x: -10 }, { opacity: 1, x: 0, duration: 0.4, ease: "expo.out" }, at + 0.03);
        tl.fromTo(r, { backgroundColor: "rgba(52,213,153,0.18)" }, { backgroundColor: "rgba(52,213,153,0)", duration: Math.min(1.0, DUR - at - 0.05), ease: "power2.out" }, at + 0.03);
      }

      // ---- Scene 2: "so you can charge by usage" — usage card slides over the chart, meters fill ----
      tl.fromTo(chart, { opacity: 1 }, { opacity: 0, duration: 0.45, ease: "power2.out" }, 2.4);
      tl.fromTo(top3, { opacity: 1 }, { opacity: 0.3, duration: 0.45, ease: "power2.out" }, 2.4);
      tl.fromTo(byId("scrim"), { opacity: 0 }, { opacity: 1, duration: 0.5, ease: "power2.out" }, 2.42);
      tl.fromTo(card, { opacity: 0, y: 34, scale: 0.96 }, { opacity: 1, y: 0, scale: 1, duration: 0.5, ease: "expo.out" }, 2.42);
      tl.fromTo(cardFlash, { opacity: 1 }, { opacity: 0, duration: 0.9, ease: "power2.out", immediateRender: false }, 2.62);
      tl.fromTo(glow, { opacity: 0 }, { opacity: 1, duration: 0.8, ease: "power2.out" }, 2.6);

      // ---- Scene 3: "selling APIs and tools to AI agents" — agent chip + request pills race the meter ----
      tl.fromTo(agent, { opacity: 0, scale: 0.85 }, { opacity: 1, scale: 1, duration: 0.45, ease: "expo.out" }, 4.42);
      tl.fromTo(agentFlash, { opacity: 1 }, { opacity: 0, duration: 0.7, ease: "power2.out", immediateRender: false }, 4.46);
      var pills = byId("chips").querySelectorAll("[data-pill]");
      for (var j = 0; j < pills.length; j++) {
        var pt = TICKS[j][0];
        tl.fromTo(pills[j], { opacity: 0, scale: 0.85, x: -8 }, { opacity: 1, scale: 1, x: 0, duration: 0.38, ease: "expo.out" }, pt);
        tl.fromTo(pills[j].querySelector("[data-flash]"), { opacity: 1 }, { opacity: 0, duration: 0.6, ease: "power2.out", immediateRender: false }, pt + 0.02);
      }
      // "AI agents": the agent chip lights up again as the meter tips amber
      tl.fromTo(agentFlash, { opacity: 1 }, { opacity: 0, duration: 0.6, ease: "power2.out", immediateRender: false }, 6.1);

      // pin the timeline to the frame's full duration (hold at the edge)
      tl.set({}, {}, DUR);

      window.__timelines["10-usage"] = tl;
    })();
  </script>
</div>
</template>
