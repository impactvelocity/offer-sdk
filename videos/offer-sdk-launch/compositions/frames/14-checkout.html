/* ==========================================================================

   HOW TO USE IN A FRAME
   1. Paste this whole file inside the style block that lives inside your frame template.

   2. Build the window from shell.html. Author it at its LOGICAL size

  --btn-neon-bg: rgb(52 213 153 / .08); --shadow-brand: inset 0 0 0 1px rgb(52 213 153 / .85), inset 0 0 14px -6px rgb(52 213 153 / .35), 0 0 16px -6px rgb(52 213 153 / .4);
