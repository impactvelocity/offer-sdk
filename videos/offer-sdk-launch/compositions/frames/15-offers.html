<script>
(function () {
  var $ = function (id) { return document.getElementById("f15-" + id); };
  var tl = gsap.timeline({ paused: true });

  var cam = $("cam"), pan = $("pan"), win = $("window"), cur = $("cursor");

  // ---- static initial states (camera at rest: window centre 960,470 · scale 1.1) ----
  gsap.set(cam, { scale: 1.1, transformOrigin: "960px 470px" });
  gsap.set(pan, { x: 0, y: 0 });
  gsap.set(cur, { x: 640, y: 205, transformOrigin: "0% 0%" });
  gsap.set([$("pA"), $("pB")], { transformOrigin: "0% 100%" });
  gsap.set($("pA-strike"), { transformOrigin: "0% 50%" });
  gsap.set([$("inc"), $("pv-seg"), $("pv-bonus")], { transformOrigin: "0% 50%" });
  gsap.set([$("gen"), $("glow"), $("pv-bump"), $("bump"), $("pro-on")], { transformOrigin: "50% 50%" });

  // ---- helpers ----
  function move(t, x, y, d) { tl.to(cur, { x: x, y: y, duration: d, ease: "power3.inOut" }, t); }
  function click(t, rid) {
    tl.to(cur, { scale: 0.86, duration: 0.06, ease: "power3.out" }, t);
    tl.to(cur, { scale: 1, duration: 0.16, ease: "power3.out" }, t + 0.06);
    tl.fromTo($(rid), { opacity: 0, scale: 0.3 }, { opacity: 0.95, scale: 0.35, duration: 0.03, ease: "none" }, t);
    tl.to($(rid), { opacity: 0, scale: 1.6, duration: 0.42, ease: "expo.out" }, t + 0.03);
  }
  function press(el, t) {
    tl.to(el, { scale: 0.96, duration: 0.06, ease: "power3.out" }, t);
    tl.to(el, { scale: 1, duration: 0.2, ease: "power3.out" }, t + 0.06);
  }
  // discrete text states via tl.set (seek-safe, no callbacks)
  function typeInto(el, str, t, d) {
    var step = d / str.length;
    for (var i = 1; i <= str.length; i++) tl.set(el, { textContent: str.slice(0, i) }, t + (i - 1) * step);
  }
  // neon glow flash: outer glow swells then relaxes back to the element's own resting shadow
  var G0 = "0 0 0px 0px rgba(52,213,153,0)", G1 = "0 0 22px 3px rgba(52,213,153,0.6)";
  function flash(el, t, base, rest) {
    base = base || ""; rest = rest || G0;
    tl.fromTo(el, { boxShadow: base + rest }, { boxShadow: base + G1, duration: 0.12, ease: "power2.out" }, t);
    tl.to(el, { boxShadow: base + rest, duration: 0.5, ease: "power2.out" }, t + 0.12);
  }
  // chip pop 0.85 -> 1 (no overshoot)
  function pop(el, t, extraFrom, extraTo) {
    tl.fromTo(el, Object.assign({ opacity: 0, scale: 0.85 }, extraFrom || {}),
      Object.assign({ opacity: 1, scale: 1, duration: 0.42, ease: "expo.out" }, extraTo || {}), t);
  }
  var FOCUS = { borderColor: "#34d599", boxShadow: "0 0 0 3px rgba(52,213,153,0.4)" };
  var BLUR = { borderColor: "#323238", boxShadow: "0 0 0 0px rgba(52,213,153,0)" };
  function focus(el, t) { tl.to(el, Object.assign({ duration: 0.15, ease: "power3.out" }, FOCUS), t); }
  function blur(el, t) { tl.to(el, Object.assign({ duration: 0.2, ease: "power3.out" }, BLUR), t); }

  // ===== "Offers sit on top of a plan." (0.0–1.2) =====
  tl.fromTo(win, { opacity: 0, y: 14 }, { opacity: 1, y: 0, duration: 0.4, ease: "expo.out" }, 0);
  focus($("name"), 0.02);
  tl.fromTo($("name-caret"), { opacity: 0 }, { opacity: 1, duration: 0.04 }, 0.02);
  tl.fromTo($("name-ph"), { opacity: 1 }, { opacity: 0, duration: 0.04 }, 0.08);
  typeInto($("name-val"), "Spring launch", 0.08, 0.42);
  tl.fromTo(cur, { opacity: 0 }, { opacity: 1, duration: 0.2, ease: "power3.out" }, 0.1);

  // Pro plan chip lands on "top" (0.74)
  move(0.3, 501, 246, 0.32);
  click(0.64, "r2");
  blur($("name"), 0.64);
  tl.to($("name-caret"), { opacity: 0, duration: 0.04 }, 0.64);
  pop($("pro-on"), 0.66);
  flash($("pro-on"), 0.66, "inset 0 0 0 1px rgba(52,213,153,0.85), inset 0 0 14px -6px rgba(52,213,153,0.35), ", "0 0 16px -6px rgba(52,213,153,0.4)");
  tl.fromTo($("pro-ck"), { opacity: 0, scale: 0 }, { opacity: 1, scale: 1, duration: 0.35, ease: "expo.out" }, 0.68);
  tl.to($("pro-txt"), { color: "#5fe3b1", duration: 0.2 }, 0.66);

  // live sync: the checkout preview builds for Pro ($29/mo by "plan.")
  tl.fromTo($("pv-empty"), { opacity: 1 }, { opacity: 0, duration: 0.18, ease: "power3.out" }, 0.68);
  tl.fromTo($("pv-card"), { opacity: 0, y: 10, scale: 0.97 }, { opacity: 1, y: 0, scale: 1, duration: 0.45, ease: "expo.out" }, 0.7);
  tl.fromTo(gsap.utils.toArray(".f15-pv-in"), { opacity: 0, y: 6 },
    { opacity: 1, y: 0, duration: 0.4, ease: "expo.out", stagger: 0.045 }, 0.74);

  // ===== punch-in: form + preview framed before "better deal" (2.43) =====
  // nested wrappers: screen = O + S*(P + T - O), O = (960,470); content centre P=(1097,471) -> (~932,450)
  // (nudged 27px left so the nav footer stays out of the caption band)
  tl.to(cam, { scale: 1.44, duration: 1.0, ease: "power3.inOut" }, 1.2);
  tl.to(pan, { x: -164, y: -14.7, duration: 1.0, ease: "power3.inOut" }, 1.2);
  tl.to(cam, { scale: 1.48, duration: 3.4, ease: "sine.inOut" }, 2.2);   // slow creep while edits land

  // "better deal" — Percent off, 20, price counts $29 -> $23.20
  move(1.55, 371, 340, 0.58);
  click(2.17, "r3");
  tl.to($("seg-no-on"), { opacity: 0, duration: 0.12 }, 2.19);
  tl.fromTo($("seg-pct-on"), { opacity: 0, scale: 0.9 }, { opacity: 1, scale: 1, duration: 0.3, ease: "expo.out" }, 2.19);
  tl.to($("seg-no"), { color: "rgba(236,236,238,0.68)", duration: 0.12 }, 2.19);
  tl.to($("seg-pct"), { color: "#ececee", duration: 0.12 }, 2.19);
  tl.fromTo($("fields"), { opacity: 0.4 }, { opacity: 1, duration: 0.25, ease: "power3.out" }, 2.2);
  focus($("pct"), 2.22);
  tl.fromTo($("pct-caret"), { opacity: 0 }, { opacity: 1, duration: 0.04 }, 2.22);
  tl.fromTo($("pct-ph"), { opacity: 1 }, { opacity: 0, duration: 0.04 }, 2.3);
  typeInto($("pct-val"), "20", 2.3, 0.12);

  var COUNT_AT = 2.42, COUNT_DUR = 0.85;
  tl.to($("pA-per"), { opacity: 0, duration: 0.18, ease: "power3.out" }, COUNT_AT);
  tl.to($("pA"), { x: 150, scale: 0.46, opacity: 0.62, duration: 0.55, ease: "power4.out" }, COUNT_AT);
  tl.fromTo($("pA-strike"), { scaleX: 0 }, { scaleX: 1, duration: 0.28, ease: "power3.out" }, 2.8);
  tl.fromTo($("pB"), { opacity: 0, scale: 0.7 }, { opacity: 1, scale: 1, duration: COUNT_DUR, ease: "power3.out" }, COUNT_AT);
  tl.fromTo($("pB-num"), { color: "#5fe3b1" }, { color: "#ececee", duration: 0.5, ease: "power2.out" }, COUNT_AT + COUNT_DUR);
  // $29.00 -> $23.20 (20% off), stepped at 30fps along power3.out — same ease as the scale growth
  var priceEl = $("pB-num"), STEPS = Math.round(COUNT_DUR * 30);
  for (var k = 1; k <= STEPS; k++) {
    var pr = k / STEPS, eased = 1 - Math.pow(1 - pr, 3);
    tl.set(priceEl, { textContent: "$" + (29 - 5.8 * eased).toFixed(2) }, COUNT_AT + pr * COUNT_DUR);
  }
  tl.fromTo($("pv-note"), { opacity: 0, y: 4 }, { opacity: 1, y: 0, duration: 0.4, ease: "expo.out" }, 2.86);

  // "change the price" (3.04) — Yearly ticks, preview gains the Monthly / Yearly toggle
  move(2.55, 437, 478, 0.37);
  click(2.95, "r5");
  blur($("pct"), 2.95);
  tl.to($("pct-caret"), { opacity: 0, duration: 0.04 }, 2.95);
  pop($("yearly-fill"), 2.97, { scale: 0.6 });
  flash($("yearly-fill"), 2.97);
  pop($("pv-seg"), 3.04, { y: -4 }, { y: 0 });
  flash($("pv-seg"), 3.04);

  // "attach incentives" (3.96) — +500 AI credits chip, mirrored in the preview's included list
  move(3.35, 843, 535, 0.42);
  click(3.8, "r6");
  tl.fromTo($("inc-empty"), { opacity: 1 }, { opacity: 0, duration: 0.1 }, 3.82);
  pop($("inc"), 3.84, { x: -6 }, { x: 0 });
  flash($("inc"), 3.84);
  tl.fromTo($("pv-bonus"), { opacity: 0, x: -10 }, { opacity: 1, x: 0, duration: 0.42, ease: "expo.out" }, 3.94);

  // "add order bumps" (5.21) — Template pack +$19 row, preview bump row (ticks on "bumps")
  move(4.58, 843, 627, 0.4);
  click(5.0, "r7");
  tl.fromTo($("bump-empty"), { opacity: 1 }, { opacity: 0, duration: 0.1 }, 5.02);
  pop($("bump"), 5.04, { y: -8, scale: 0.96 }, { y: 0 });
  flash($("bump"), 5.04);
  pop($("pv-bump"), 5.14, { scale: 0.92 });
  flash($("pv-bump"), 5.14);
  pop($("pvb-fill"), 5.42, { scale: 0.6 });

  // ===== "You can build offers yourself" — pull back, Create offer + toast =====
  tl.to(cam, { scale: 1.1, duration: 0.6, ease: "power3.inOut" }, 5.6);
  tl.to(pan, { x: 0, y: 0, duration: 0.6, ease: "power3.inOut" }, 5.6);
  move(5.62, 1285, 32, 0.52);
  click(6.18, "r8");
  press($("create"), 6.18);
  tl.fromTo($("toast"), { opacity: 0, y: 14 }, { opacity: 1, y: 0, duration: 0.45, ease: "expo.out" }, 6.34);

  // ===== "or let the Offer Agent create them" — neon agent button pops + glow sweep =====
  tl.to($("actgroup"), { x: -220, duration: 0.45, ease: "expo.out" }, 7.3);
  pop($("gen"), 7.4);
  tl.fromTo($("glow"), { opacity: 0, scale: 0.7 }, { opacity: 0.85, scale: 1.05, duration: 0.35, ease: "power2.out" }, 7.42);
  tl.to($("glow"), { opacity: 0.4, scale: 1, duration: 0.55, ease: "power2.inOut" }, 7.8);
  tl.fromTo($("sweep"), { x: -80 }, { x: 230, duration: 0.6, ease: "power2.inOut" }, 7.55);
  move(7.48, 1336, 40, 0.5);

  window.__timelines = window.__timelines || {};
  window.__timelines["15-offers"] = tl;
})();
