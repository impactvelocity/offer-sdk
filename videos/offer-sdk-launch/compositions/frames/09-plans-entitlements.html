      tl.fromTo($("page-plans"), { opacity: 1 }, { opacity: 0, duration: 0.16, ease: "power2.out" }, 1.58);

      // ---- AI credits limit counts 0 -> 2,500 (one linear clock; a modifier, not onUpdate,

      var chipNum = $("chip-num"), lastTxt = null;

      var render = function (t) {
        var p = Math.min(1, Math.max(0, (t - C0) / (C1 - C0)));
        var e = 1 - Math.pow(1 - p, 3);
        var v = Math.round((2500 * e) / 50) * 50;
        var txt = v.toLocaleString("en-US");
        if (txt !== lastTxt) { chipNum.textContent = txt; lastTxt = txt; }
      };
      var clock = { t: 0 };
      tl.fromTo(clock, { t: 0 }, { t: DUR, duration: DUR, ease: "none", modifiers: { t: function (v) { render(parseFloat(v) || 0); return v; } } }, 0);
