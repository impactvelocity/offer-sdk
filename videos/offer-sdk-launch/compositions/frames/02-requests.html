  <script>
    (function () {

      var root = document.querySelector('[data-composition-id="02-requests"]');

      function inRow(r, cls) { return byId("r-" + r).querySelector('[class~="02-requests-' + cls + '"]'); }

        live: 5.82, friday: 6.31, every: 7.16, yes: 7.41, spaghetti: 8.24, code: 8.69, another2: 9.12, deploy: 9.54 };

      /* ---------- typed lines (discrete-text-sequence) ---------- */
      function esc(s) { return s.replace(/&/g, "&amp;").replace(/</g, "&lt;").replace(/>/g, "&gt;"); }
      function textOf(tokens) { var s = ""; for (var i = 0; i < tokens.length; i++) s += tokens[i][1]; return s; }

        var out = "", pos = 0;

          var str = tokens[i][1], s0 = Math.max(a, pos), s1 = Math.min(b, pos + str.length);
          if (s1 > s0) {
            var part = esc(str.slice(s0 - pos, s1 - pos));

          }

        }

        for (var k = 0; k < ev.length; k++) ev[k].t = k === ev.length - 1 ? t1 : t0 + step * (k + 1 + JIT[k % JIT.length]);
        return ev;
      }

      var T_SALLY = [["k", "if"], ["", " (user."], ["p", "email"], ["", " === "], ["s", '"sally@…"'], ["", ") trialDays = "], ["n", "30"], ["", ";"]];
      var T_ACME = [["k", "if"], ["", " (user."], ["p", "org"], ["", " === "], ["s", '"acme"'], ["", ") { seats = "], ["n", "50"], ["", "; sso = "], ["k", "true"], ["", "; } "], ["c", "// ask Dave"]];
      var T_SARAH = [["k", "if"], ["", " (ref === "], ["s", '"sarah"'], ["", " && today < "], ["d", "FRIDAY"], ["", ") price = "], ["n", "19"], ["", ";"]];
      var T_TODO = [["c", "// TODO: affiliate bundles???"]];
      var T_EXP = [["k", "if"], ["", " (plan === "], ["s", '"pro"'], ["", " || user."], ["p", "id"], ["", " === "], ["s", '"u_8812"'], ["", ") "], ["f", "enableExports"], ["", "();"]];

      var friIdx = textOf(T_SARAH).indexOf("FRIDAY");
      var LINES = [
        { r: "sally", slot: 2, tokens: T_SALLY, open: 0.80, t0: 0.86, t1: 1.70, sizes: [3, 2, 4, 3, 3, 2] },
        { r: "acme",  slot: 3, tokens: T_ACME,  open: 2.64, t0: 2.70, t1: 3.36, sizes: [5, 4, 6, 5] },
        { r: "sarah", slot: 4, tokens: T_SARAH, open: 4.22, t0: 4.28, t1: 5.12, sizes: [3, 4, 3, 4], typoAt: friIdx + 4, typoChar: "Y" },
        { r: "todo",  slot: 5, spill: true, tokens: T_TODO,  open: 8.00, t0: 8.03, t1: 8.16, sizes: [10, 10, 9] },
        { r: "exp",   slot: 6, spill: true, tokens: T_EXP,   open: 8.18, t0: 8.21, t1: 8.50, sizes: [8, 9, 8, 9, 8, 9, 9] }
      ];

      // Build chunks: each switched on by a zero-duration set (seek-safe both ways).
      LINES.forEach(function (L) {
        var box = inRow(L.r, "typed");
        L.caret = inRow(L.r, "caret");
        L.ev = schedule(L.tokens, L.t0, L.t1, L.sizes, L.typoAt, L.typoChar);

      });

      LINES.forEach(function (L, i) {

        for (var bt = L.done + 0.36; bt < end - 0.05; bt += 0.36) { on = !on; tl.set(L.caret, { opacity: on ? 1 : 0 }, bt); }
        tl.set(L.caret, { opacity: i + 1 < LINES.length ? 0 : 1 }, end);

      /* ---------- line insertion (FLIP: the line below slides down, a new row opens) ---------- */
      var exportRow = byId("r-export"), lns = byId("lns").children;

      /* "one customer" → Sally slams in (right), beam → line 3 types → amber → deploy #1 on "trial" */
      slam("sally", CUE.customer - 0.07, { dx: 80, dy: 0, r0: 10, r1: 2 });

      slam("bill", CUE.another - 0.08, { dx: -80, dy: 30, r0: -10, r1: -2.5 });

      cam(2.6, 0.55, 1.05, 960, rowCY(3));

        { color: "#ffc35f", textShadow: "0 0 14px rgba(255,195,95,0.85)", duration: 0.16, ease: "power2.out", immediateRender: false }, CUE.friday - 0.03);
      tl.to(byId("r-sarah").querySelectorAll(".d"), { textShadow: "0 0 6px rgba(255,195,95,0.35)", duration: 0.5, ease: "power2.out" }, CUE.friday + 0.15);
      cam(5.95, 0.85, 1.015, 960, 470, "power2.inOut");

      /* "Every yes" → each yes flares in rhythm: bubble ping + its special-case line */
      var yes = [["sally", "sally"], ["bill", "acme"], ["sarah", "sarah"]];
      yes.forEach(function (p, i) {
        var t = CUE.every - 0.02 + i * 0.13, hl = inRow(p[1], "hl");
        flash(byId("ring-" + p[0]), t, 1, 0.5, 1, 1.05);
        tl.fromTo(byId("bub-" + p[0]), { scale: 1.06 }, { scale: 1, duration: 0.35, ease: "expo.out", immediateRender: false }, t);

      });

      tl.fromTo(byId("count"), { scale: 1.16 }, { scale: 1, duration: 0.4, ease: "expo.out", immediateRender: false }, CUE.yes);

      /* "spaghetti code" → two more lines spill in, the file turns red, the special cases tangle */
      openLine(LINES[3]);

      var TR = CUE.spaghetti;

      var RED_HL = { backgroundColor: "rgba(229,72,77,0.15)", boxShadow: "inset 0 0 0 1px rgba(229,72,77,0.45)" };
      ["sally", "acme", "sarah"].forEach(function (r, i) {

        tl.to(inRow(r, "mk"), { backgroundColor: "#e5484d", boxShadow: "0 0 14px rgba(229,72,77,0.9)", duration: 0.3, ease: "power2.out" }, TR + 0.04 + i * 0.04);

      ["todo", "exp"].forEach(function (r, i) {
        var at = i === 0 ? TR + 0.02 : LINES[4].done + 0.02;
        tl.to(inRow(r, "hl"), { backgroundColor: "rgba(229,72,77,0.2)", boxShadow: "inset 0 0 0 1.5px rgba(229,72,77,0.7)", duration: 0.3, ease: "power2.out" }, at);

        tl.to(byId("r-" + r).querySelector('[class~="02-requests-src"]'), { color: "#ff9a9c", duration: 0.3, ease: "power2.out" }, at);

      tl.fromTo(inRow("exp", "mk"), { opacity: 1, scaleY: 0, backgroundColor: "#ff8a8d", boxShadow: "0 0 14px rgba(229,72,77,0.9)" },
        { scaleY: 1, backgroundColor: "#e5484d", duration: 0.35, ease: "expo.out", immediateRender: false }, LINES[4].done + 0.02);
      // literal spaghetti: tangled wires between the special-case markers, spilling out of the gutter
      var MX = 103, Y = function (slot) { return ROWS_TOP + slot * ROW + ROW / 2; };
      var WIRES = [
