      tl.fromTo(tab, { scale: 1.07 }, { scale: 1, duration: 0.4, ease: "expo.out", immediateRender: false }, T_RENDER + 0.12);
      tl.fromTo(renderWord, { color: "#ececee", textShadow: "0px 0px 0px rgba(52, 213, 153, 0)" },
        { color: "#5fe3b1", textShadow: "0px 0px 16px rgba(52, 213, 153, 0.75)", duration: 0.25, ease: "power2.out", immediateRender: false }, T_RENDER + 0.06);
      tl.fromTo(cloud, { color: "#9c9ea5" }, { color: "#5fe3b1", duration: 0.25, ease: "power2.out", immediateRender: false }, T_RENDER);
      tl.fromTo(bhalo, { opacity: 0.35 }, { opacity: 1, duration: 0.18, ease: "power2.out", immediateRender: false }, T_RENDER + 0.04);
      tl.fromTo(bhalo, { opacity: 1 }, { opacity: 0.6, duration: 0.7, ease: "power2.out", immediateRender: false }, T_RENDER + 0.22);

      // ---- "PayPal handles checkout" (5.11 / 5.58): tile slides in, line draws, packet zips, pill pops + press ----
      tl.fromTo(paypal, { opacity: 0, x: 70 }, { opacity: 1, x: 0, duration: 0.5, ease: "expo.out" }, 4.98);
      draw(cPp, L_PP, 5.08, 0.34);
      tl.fromTo(packet, { opacity: 0 }, { opacity: 1, duration: 0.05, ease: "none" }, 5.3);
      tl.fromTo(packet, { attr: { cx: 770 } }, { attr: { cx: 1532 }, duration: 0.3, ease: "power2.in" }, 5.3);
      tl.fromTo(ppring, { opacity: 0 }, { opacity: 1, duration: 0.12, ease: "power2.out" }, 5.58);
      tl.fromTo(ppring, { opacity: 1 }, { opacity: 0.45, duration: 0.6, ease: "power2.out", immediateRender: false }, 5.7);
      tl.fromTo(checkout, { opacity: 0, y: -10, scale: 0.85 }, { opacity: 1, y: 0, scale: 1, duration: 0.4, ease: "expo.out" }, 5.4);
      var PRESS_START = 5.68, PRESS_DUR = 0.08, RELEASE_START = PRESS_START + PRESS_DUR;
      tl.fromTo(btn, { scale: 1 }, { scale: 0.95, duration: PRESS_DUR, ease: "power1.in", immediateRender: false }, PRESS_START);
      tl.fromTo(btn, { scale: 0.95 }, { scale: 1, duration: 0.42, ease: "expo.out", immediateRender: false }, RELEASE_START);
      tl.fromTo(burst, { scale: 1, opacity: 0 }, { scale: 2, opacity: 0.55, duration: 0.3, ease: "power2.out" }, RELEASE_START);
      tl.fromTo(burst, { opacity: 0.55 }, { opacity: 0, duration: 0.45, ease: "power2.in", immediateRender: false }, RELEASE_START + 0.3);

      // ---- "the whole subscription lifecycle" (6.19-6.90): rail draws, stations pop in dim ----
      tl.fromTo(origin, { opacity: 0, scale: 0.4, svgOrigin: "200 780" }, { opacity: 1, scale: 1, svgOrigin: "200 780", duration: 0.4, ease: "expo.out" }, 6.1);
      tl.fromTo(rail, { strokeDashoffset: L_RAIL + 4 }, { strokeDashoffset: 0, duration: 0.6, ease: "power2.out" }, 6.14);
      // each station pops as the drawing track reaches it (power2.out reach times: 6.21 / 6.31 / 6.44 / ~6.62)
      [6.17, 6.27, 6.39, 6.56].forEach(function (at, i) {
        tl.fromTo(stations[i], { opacity: 0, y: 14, scale: 0.9 }, { opacity: 1, y: 0, scale: 1, duration: 0.45, ease: "expo.out" }, at);
      });

      // ---- the neon pulse: charges at the origin on "lifecycle", then hops station to station on each word ----
      // Renewals 7.59 · Upgrades 8.13 · Pauses 8.74 · Cancellations 9.53 — each hop lands just before its word.
      var X0 = 200;
      var SEGS = [
        { a: 7.22, b: 7.55, x0: 200, x1: 520 },
        { a: 7.80, b: 8.08, x0: 520, x1: 880 },
        { a: 8.42, b: 8.69, x0: 880, x1: 1240 },
        { a: 9.18, b: 9.48, x0: 1240, x1: 1600 }
      ];
      function pulseX(t) {
        var x = X0;
        for (var i = 0; i < SEGS.length; i++) {
          var s = SEGS[i];
          if (t >= s.b) { x = s.x1; continue; }
          if (t > s.a) { x = s.x0 + (s.x1 - s.x0) * E_IN2((t - s.a) / (s.b - s.a)); }
          break;
        }
        return x;
      }
      var CHARGE_A = 6.82, CHARGE_B = SEGS[0].a;

      // asr-keyword-glow (karaoke): one linear driver lights every station from scene time
      var TIMINGS = {
        renewals: { start: 7.55, end: 8.0 },
        upgrades: { start: 8.08, end: 8.6 },
        pauses: { start: 8.69, end: 9.15 },
        cancellations: { start: 9.48, end: 99 }
      };
      var ATTACK_DUR = 0.12, RELEASE = 0.4, REST_LEVEL = 0.55;
      function envelope(time, start, end) {
        if (time < start) return 0;
        if (time < end) return Math.min((time - start) / ATTACK_DUR, 1);
        var releaseEnd = end + RELEASE;
        if (time < releaseEnd) return 1 - ((time - end) / RELEASE) * (1 - REST_LEVEL);
        return REST_LEVEL;
      }
      function flashEnv(time, start) {
        if (time < start) return 0;
        if (time < start + 0.06) return (time - start) / 0.06;
        return Math.max(0, 1 - (time - start - 0.06) / 0.45);
      }
      var REST_TXT = { r: 133, g: 135, b: 142 }, ACTIVE_TXT = { r: 236, g: 236, b: 238 };
      var REST_ICO = { r: 111, g: 113, b: 120 }, ACTIVE_ICO = { r: 95, g: 227, b: 177 };
      var REST_BG = { r: 24, g: 24, b: 27 }, ACTIVE_BG = { r: 19, g: 42, b: 34 };
      var REST_BD = { r: 42, g: 42, b: 47 }, ACTIVE_BD = { r: 52, g: 213, b: 153 };
      function lerp(a, b, t) { return Math.round(a + (b - a) * t); }
      function mix(a, b, t) { return "rgb(" + lerp(a.r, b.r, t) + ", " + lerp(a.g, b.g, t) + ", " + lerp(a.b, b.b, t) + ")"; }
      var pills = stations.map(function (st) {
        var pill = st.firstElementChild;
        return { el: pill, label: pill.querySelector("span"), icon: pill.querySelector("svg"), key: pill.getAttribute("data-word") };
      });

      function paint(t) {
        // boundary draw (svg-path-draw on the mask) + a neon spark riding the draw head
        var p = E_DRAW(clamp01((t - B0) / (B1 - B0)));
        bdraw.style.strokeDashoffset = p <= 0 ? String(L_BOUND + 4) : (L_BOUND * (1 - p)).toFixed(2);
        if (p > 0 && p < 1) {
          var pt = bdraw.getPointAtLength(p * L_BOUND);
          spark.setAttribute("cx", pt.x.toFixed(2));
          spark.setAttribute("cy", pt.y.toFixed(2));
          spark.setAttribute("opacity", Math.min(1, p / 0.03, (1 - p) / 0.06).toFixed(3));
        } else {
          spark.setAttribute("opacity", "0");
        }

        // rail pulse: position, comet tail, progress fill
        var x = pulseX(t);
        var xPrev = pulseX(t - 0.05);
        var tailLen = Math.max(0, Math.min(170, (x - xPrev) * 2.2));
        var charge = (t > CHARGE_A && t < CHARGE_B) ? (t - CHARGE_A) / (CHARGE_B - CHARGE_A) : 0;
        pulse.setAttribute("cx", x.toFixed(2));
        pulse.setAttribute("r", (5 + 3.5 * charge).toFixed(2));
        pulse.setAttribute("opacity", clamp01((t - 6.14) / 0.2).toFixed(3));
        tail.setAttribute("x", (x - tailLen).toFixed(2));
        tail.setAttribute("width", tailLen.toFixed(2));
        tail.setAttribute("opacity", tailLen > 2 ? "1" : "0");
        var filled = x - X0;
        railFill.style.strokeDashoffset = filled < 0.5 ? String(L_FILL + 4) : (L_FILL - filled).toFixed(2);
        originRing.setAttribute("stroke-width", (2 + 2 * charge).toFixed(2));

        // stations: lit envelope (breadcrumb rest) + arrival flash
        pills.forEach(function (pl) {
          var w = TIMINGS[pl.key];
          var lit = envelope(t, w.start, w.end);
          var fl = flashEnv(t, w.start);
          pl.el.style.transform = "scale(" + (1 + 0.05 * lit + 0.07 * fl).toFixed(4) + ")";
          pl.el.style.backgroundColor = mix(REST_BG, ACTIVE_BG, lit);
          pl.el.style.borderColor = mix(REST_BD, ACTIVE_BD, lit);
          pl.el.style.boxShadow = "0 0 " + (14 * lit + 30 * fl).toFixed(2) + "px rgba(52, 213, 153, " + (0.28 * lit + 0.42 * fl).toFixed(3) + ")";
          pl.label.style.color = mix(REST_TXT, ACTIVE_TXT, lit);
          pl.label.style.textShadow = "0 0 " + (18 * lit).toFixed(2) + "px rgba(52, 213, 153, " + (0.6 * lit).toFixed(3) + ")";
          pl.icon.style.color = mix(REST_ICO, ACTIVE_ICO, lit);
        });
      }
      // The driver is an accessor: every timeline render writes driver.t, which repaints the
      // painted layers deterministically from scene time (works with or without seek events).
      var driver = {
        _t: 0,
        get t() { return this._t; },
        set t(v) { this._t = v; paint(v); }
      };
      paint(0);
      tl.fromTo(driver, { t: 0 }, { t: DUR, duration: DUR, ease: "none" }, 0);

      window.__timelines = window.__timelines || {};
      window.__timelines["07-own-it"] = tl;
    })();
  </script>
</template>
