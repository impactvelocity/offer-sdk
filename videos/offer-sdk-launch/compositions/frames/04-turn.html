      const BODY0 = PAD * 2 + 8 * LH;                       // 324: billing.ts body with 8 lines

      // ---------- macro camera: slow push that settles before the hold ----------
      tl.fromTo($("stage"), { scale: 1 }, { scale: 1.025, duration: 5.9, ease: "power1.out" }, 0);
      tl.fromTo($("bg-img"), { scale: 1.08 }, { scale: 1.0, duration: 5.9, ease: "power2.out" }, 0);

      tl.fromTo($("bg-img"), { opacity: 0.66 }, Object.assign({ opacity: 0.5, duration: 0.6, ease: "power2.inOut" }, NI), 0.7);

      // the mark draws itself

        tl.fromTo(p, { strokeDashoffset: len }, { strokeDashoffset: 0, duration: 0.4, ease: "expo.out" }, 0.03 + i * 0.06);

      tl.fromTo($("word"), { opacity: 0, x: -14 }, { opacity: 1, x: 0, duration: 0.4, ease: "expo.out" }, 0.1);

      // "takes" (0.54): lockup docks to the hub, billing.ts slides in on the right

      let bodyH = BODY0;

        tl.fromTo($("body"), { scaleY: from / BODY0 }, Object.assign({ scaleY: to / BODY0, duration: dur, ease: ease }, NI), at);
        tl.fromTo($("cap"), { y: from - BODY0 }, Object.assign({ y: to - BODY0, duration: dur, ease: ease }, NI), at);

      const GROUPS = [

        { lines: [2, 5], blk: 1, w: 1.38, arc: 40 },   // "access,"

        // 1) the group lights up neon
        g.lines.forEach((l) => tl.fromTo($("hl-" + l), { opacity: 0, scaleX: 0.5 }, { opacity: 1, scaleX: 1, duration: 0.16, ease: "expo.out" }, W - 0.22));

        // 2) its lines fold together and shrink away ...

        tl.fromTo(arc, { y: g.arc }, Object.assign({ y: 0, duration: FLY / 2, ease: "sine.in" }, NI), W + 0.12 + FLY / 2);
        // dock: quick press + the neon outline settles to a faint edge
        const DOCK = W + 0.12 + FLY;

      tl.fromTo($("pfl"), { opacity: 0 }, { opacity: 1, duration: 0.12, ease: "power2.out" }, 4.12);
