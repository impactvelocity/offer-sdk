  <script>
    (function () {
      window.__timelines = window.__timelines || {};
      var tl = gsap.timeline({ paused: true });
      var scope = document.querySelector('[data-composition-id="01-launch"]') || document;
      var q = function (k) { return scope.querySelector('[data-l="' + k + '"]'); };

      var art = q("art"), stage = q("stage"), lockup = q("lockup"), lockupIn = q("lockup-in");
      var tile = q("tile"), word = q("word"), live = q("live"), liveFlash = q("live-flash"), ping = q("ping");
      var proNeon = q("pro-neon"), proFlash = q("pro-flash"), feat = q("feat"), featFlash = q("feat-flash");
      var pro = scope.querySelector('[data-plan="pro"]');
      var starter = scope.querySelector('[data-plan="starter"]');
      var enterprise = scope.querySelector('[data-plan="enterprise"]');

      // ---- macro: neon backdrop settles in under everything (moving from frame 0) ----
      tl.fromTo(art, { opacity: 0.32, scale: 1.08 }, { opacity: 0.62, scale: 1, duration: 3.0, ease: "power2.out" }, 0);

      // ---- "You've launched your app." — lockup is on screen and moving by 0.1s ----
      tl.fromTo(lockupIn, { scale: 0.94 }, { scale: 1, duration: 1.1, ease: "power2.out" }, 0);
      tl.fromTo(tile, { opacity: 0, scale: 0.55, rotation: -14 }, { opacity: 1, scale: 1, rotation: 0, duration: 0.5, ease: "expo.out" }, 0);
      tl.fromTo(word, { yPercent: 105 }, { yPercent: 0, duration: 0.55, ease: "expo.out" }, 0.04);
      // green Live tag pops on "launched" (0.26) with a quick neon flash
      tl.fromTo(live, { opacity: 0, scale: 0.85 }, { opacity: 1, scale: 1, duration: 0.42, ease: "expo.out" }, 0.05);
      tl.fromTo(liveFlash, { opacity: 0 }, { opacity: 1, duration: 0.1, ease: "power2.out" }, 0.14);
      tl.to(liveFlash, { opacity: 0.22, duration: 0.5, ease: "power2.out" }, 0.26);
      // live ping on "app." (0.76)
      tl.fromTo(ping, { opacity: 0, scale: 1 }, { opacity: 0.95, scale: 1.5, duration: 0.08, ease: "none" }, 0.68);
      tl.to(ping, { opacity: 0, scale: 3.6, duration: 0.55, ease: "power2.out" }, 0.76);

      // ---- "It started simple," — lockup lifts to the top third (lands on "simple" 1.53) ----
      tl.fromTo(lockup, { y: 0, scale: 1 }, { y: -172, scale: 0.66, duration: 0.62, ease: "expo.out" }, 1.06);

      // ---- "with just three plans." — cards fan out from behind Pro ----
      var FAN_AT = 1.78, STAGGER = 0.06, FAN_DUR = 0.6;
      [pro, starter, enterprise].forEach(function (el, i) {
        var at = FAN_AT + i * STAGGER;
        var isPro = el === pro;
        tl.fromTo(el,
          { xPercent: -50, yPercent: -50, x: 0, y: isPro ? 70 : 34, scale: isPro ? 0.88 : 0.9, rotation: Number(el.dataset.fromRot) },
          { xPercent: -50, yPercent: -50, x: Number(el.dataset.targetX), y: 0, scale: 1, rotation: 0, duration: FAN_DUR, ease: "expo.out" }, at);
        tl.fromTo(el, { opacity: 0 }, { opacity: 1, duration: 0.18, ease: "power1.out" }, at);
        // prices tick up as the cards land
        var price = el.querySelector("[data-count]");
        if (price) {
          var target = Number(price.dataset.count), counter = { v: 0 };
          tl.fromTo(counter, { v: 0 }, {
            v: target, duration: 0.5, ease: "power3.out",
            onUpdate: function () { price.textContent = "$" + Math.round(counter.v); }
          }, at + 0.02);
        }
      });

      // Pro gets its neon rim as it lands, then lights up on "three" (2.46)
      tl.fromTo(proNeon, { opacity: 0 }, { opacity: 1, duration: 0.3, ease: "power2.out" }, 1.98);
      tl.fromTo(proFlash, { opacity: 0 }, { opacity: 1, duration: 0.12, ease: "power2.out" }, 2.34);
      tl.to(proFlash, { opacity: 0.38, duration: 0.5, ease: "power2.out" }, 2.46);
      tl.fromTo(feat, { opacity: 0, scale: 0.85 }, { opacity: 1, scale: 1, duration: 0.38, ease: "expo.out" }, 2.3);
      tl.fromTo(featFlash, { opacity: 0 }, { opacity: 1, duration: 0.1, ease: "power2.out" }, 2.34);
      tl.to(featFlash, { opacity: 0.2, duration: 0.45, ease: "power2.out" }, 2.44);

      // small punch-in that lands on "plans." (2.78), then hold still
      tl.fromTo(stage, { scale: 1 }, { scale: 1.03, duration: 0.42, ease: "power3.out" }, 2.5);

      // pin the timeline to the frame's duration
      tl.set({}, {}, 3.34);

      window.__timelines["01-launch"] = tl;
    })();
  </script>
