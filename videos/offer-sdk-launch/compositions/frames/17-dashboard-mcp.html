            <span class="mcp17-chip" id="mcp17-chip2"><svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M14.7 6.3a1 1 0 0 0 0 1.4l1.6 1.6a1 1 0 0 0 1.4 0l3.77-3.77a6 6 0 0 1-7.94 7.94l-6.91 6.91a2.12 2.12 0 0 1-3-3l6.91-6.91a6 6 0 0 1 7.94-7.94l-3.76 3.76z"/></svg>get_usage<span class="mcp17-chip-state"><svg class="mcp17-spin" id="mcp17-spin2" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round"><path d="M21 12a9 9 0 1 1-6.219-8.56"/></svg><svg class="mcp17-ok" id="mcp17-ok2" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.6" stroke-linecap="round" stroke-linejoin="round"><path d="M20 6 9 17l-5-5"/></svg></span></span>

            <span class="mcp17-send" id="mcp17-send"><span class="mcp17-send-base"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="m5 12 7-7 7 7"/><path d="M12 19V5"/></svg></span><span class="mcp17-send-neon" id="mcp17-send-neon"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="m5 12 7-7 7 7"/><path d="M12 19V5"/></svg></span><span class="mcp17-ripple" id="mcp17-ripple"></span></span>

  <script src="https://cdn.jsdelivr.net/npm/gsap@3.14.2/dist/gsap.min.js"></script>
  <script>
    (function () {
      window.__timelines = window.__timelines || {};
      const tl = gsap.timeline({ paused: true });
      const $ = (id) => document.getElementById(id);
      const fmt = (n) => String(Math.round(n)).replace(/\B(?=(\d{3})+(?!\d))/g, ",");
      const FLASH_ON = "brightness(1.7) drop-shadow(0 0 10px rgba(52,213,153,0.85))";
      const FLASH_OFF = "brightness(1) drop-shadow(0 0 0px rgba(52,213,153,0))";

      // counters: seek-safe proxy tween writing the formatted value
      function countUp(el, at, dur, ease) {
        const to = +el.getAttribute("data-to");
        const o = { v: 0 };
        tl.fromTo(o, { v: 0 }, {
          v: to, duration: dur, ease: ease || "power3.out",
          onUpdate: function () { el.textContent = fmt(o.v); }
        }, at);
      }
      // neon glow flash (pop accent): bright + green bloom, settles to rest
      function flash(target, at, dur) {
        tl.fromTo(target, { filter: FLASH_ON }, { filter: FLASH_OFF, duration: dur || 0.5, ease: "power2.out" }, at);
      }

      // ---------------------------------------------------------------
      // Camera: one slow continuous push under the whole shot.
      // Window: at rest 1366x800 centered (960,470) scale 1.1, then on
      // "connect the MCP server" slides left + shrinks to 0.85.
      // ---------------------------------------------------------------
      tl.fromTo("#mcp17-cam", { scale: 1 }, { scale: 1.02, duration: 9.3, ease: "power1.inOut" }, 0);
      tl.fromTo(
        "#mcp17-winwrap",
        { x: 0, y: 0, scale: 1.1 },
        { x: -320, y: 0, scale: 0.85, duration: 0.6, ease: "power3.inOut" },
        3.12
      );

      // ===== Beat 1 (0.0–3.1s): "The dashboard shows your insights …" =====
      tl.fromTo(
        ".mcp17-stat",
        { opacity: 0, y: 10 },
        { opacity: 1, y: 0, duration: 0.45, ease: "expo.out", stagger: 0.05 },
        0.05
      );
      ["mcp17-n-accounts", "mcp17-n-plans", "mcp17-n-incent", "mcp17-n-usage"].forEach(function (id, i) {
        countUp($(id), 0.1 + i * 0.05, 0.85);
      });

      // sparkline draws
      const spark = $("mcp17-spark-path");
      const sparkLen = spark.getTotalLength() * 1.05;
      tl.fromTo(
        spark,
        { strokeDasharray: sparkLen + " " + sparkLen * 2, strokeDashoffset: sparkLen + 4 },
        { strokeDashoffset: 0, duration: 0.6, ease: "power2.out" },
        0.35
      );

      tl.fromTo(
        ["#mcp17-chart-card", "#mcp17-plans-card"],
        { opacity: 0, y: 12 },
        { opacity: 1, y: 0, duration: 0.45, ease: "expo.out", stagger: 0.06 },
        0.12
      );

      // "insights" (1.12): usage chart line + green→cyan area draw left→right, spike lands on the word
      // one progress value drives both the line dash and the area clip, so the fill tracks the line head
      const line = $("mcp17-chart-line");
      const areaRect = $("mcp17-area-rect");
      const lineLen = line.getTotalLength();
      line.style.strokeDasharray = lineLen + " " + lineLen * 2;
      const draw = { p: 0 };
      function applyDraw() {
        const off = (lineLen + 4) * (1 - draw.p);
        line.style.strokeDashoffset = off;
        const drawn = Math.max(0, lineLen - off);
        const x = drawn > 0 ? line.getPointAtLength(drawn).x : 44;
        areaRect.setAttribute("width", Math.max(0, x - 44));
      }
      applyDraw();
      tl.fromTo(
        draw,
        { p: 0 },
        { p: 1, duration: 0.85, ease: "power2.inOut", onUpdate: applyDraw },
        0.55
      );

      // Accounts by plan bars fill
      tl.fromTo(
        ".mcp17-fill",
        { scaleX: 0 },
        { scaleX: 1, duration: 0.55, ease: "expo.out", stagger: 0.05 },
        1.02
      );

      // lower cards
      tl.fromTo(
        ["#mcp17-recent-card", "#mcp17-top-card"],
        { opacity: 0, y: 12 },
        { opacity: 1, y: 0, duration: 0.45, ease: "expo.out", stagger: 0.06 },
        1.3
      );
      tl.fromTo(
        ".mcp17-act-row",
        { opacity: 0, x: -10 },
        { opacity: 1, x: 0, duration: 0.4, ease: "expo.out", stagger: 0.06 },
        1.6
      );

      // "every customer's usage" (1.52–2.48): Top accounts fill + count
      tl.fromTo(
        ".mcp17-top",
        { opacity: 0, x: -12 },
        { opacity: 1, x: 0, duration: 0.4, ease: "expo.out", stagger: 0.08 },
        1.44
      );
      tl.fromTo(
        ".mcp17-tfill",
        { scaleX: 0 },
        { scaleX: 1, duration: 0.6, ease: "expo.out", stagger: 0.08 },
        1.5
      );
      Array.prototype.slice.call(document.querySelectorAll(".mcp17-tcount")).forEach(function (el, i) {
        countUp(el, 1.5 + i * 0.08, 0.6, "expo.out");
      });

      // ===== Beat 2 (3.1–4.95s): "Or connect the MCP server" — chat enters, prompt types =====
      tl.fromTo(
        "#mcp17-chat",
        { opacity: 0, x: 140 },
        { opacity: 1, x: 0, duration: 0.5, ease: "expo.out" },
        3.5
      );
      // "server" (4.12): the neon "Offer MCP server · Live" tag pops + glows
      tl.fromTo(
        "#mcp17-server",
        { opacity: 0, scale: 0.85 },
        { opacity: 1, scale: 1, duration: 0.35, ease: "expo.out" },
        3.9
      );
      flash("#mcp17-server", 3.9, 0.6);

      // composer focus + send goes neon on the first keystroke
      tl.fromTo("#mcp17-comp-ring", { opacity: 0 }, { opacity: 1, duration: 0.2, ease: "power2.out" }, 3.66);
      tl.fromTo("#mcp17-caret", { opacity: 0 }, { opacity: 1, duration: 0.01 }, 3.66);
      tl.set("#mcp17-placeholder", { opacity: 0 }, 3.72);
      tl.fromTo("#mcp17-send-neon", { opacity: 0 }, { opacity: 1, duration: 0.2, ease: "power2.out" }, 3.74);

      // fast typing (~50 chars/s), done before "review"
      const typedEl = $("mcp17-typed");
      const parts = ["Pro accounts at their credit limit ", null, " 20% upgrade offer"];
      const chars = [];
      parts.forEach(function (p) {
        if (p === null) {
          const sp = document.createElement("span");
          sp.appendChild($("mcp17-bubble").querySelector(".mcp17-arrow").cloneNode(true));
          typedEl.appendChild(sp);
          chars.push(sp);
          return;
        }
        for (let i = 0; i < p.length; i++) {
          const sp = document.createElement("span");
          sp.textContent = p[i];
          typedEl.appendChild(sp);
          chars.push(sp);
        }
      });
      tl.fromTo(
        chars,
        { display: "none" },
        { display: "inline", duration: 0.001, ease: "none", stagger: 1.06 / chars.length },
        3.72
      );

      // submit: send press + ripple, prompt lands in the thread
      tl.fromTo("#mcp17-send", { scale: 1 }, { scale: 0.86, duration: 0.08, ease: "power2.in" }, 4.82);
      tl.to("#mcp17-send", { scale: 1, duration: 0.3, ease: "expo.out" }, 4.9);
      tl.fromTo("#mcp17-ripple", { opacity: 0.9, scale: 0.6 }, { opacity: 0, scale: 2.1, duration: 0.45, ease: "power2.out" }, 4.86);
      tl.set(["#mcp17-typed", "#mcp17-caret"], { opacity: 0 }, 4.9);
      tl.set("#mcp17-placeholder", { opacity: 1 }, 4.9);
      tl.fromTo(
        "#mcp17-bubble",
        { opacity: 0, y: 24, scale: 0.97, transformOrigin: "100% 100%" },
        { opacity: 1, y: 0, scale: 1, duration: 0.4, ease: "expo.out" },
        4.88
      );

      // ===== Beat 3 (4.97–7.5s): "review usage and create offers … on the fly" =====
      function toolCall(n, at, run) {
        tl.fromTo(
          "#mcp17-chip" + n,
          { opacity: 0, y: 6, scale: 0.85 },
          { opacity: 1, y: 0, scale: 1, duration: 0.32, ease: "expo.out" },
          at
        );
        tl.fromTo(
          "#mcp17-spin" + n,
          { rotation: 0, opacity: 1 },
          { rotation: 360, duration: run, ease: "none" },
          at
        );
        tl.set("#mcp17-spin" + n, { opacity: 0 }, at + run);
        tl.fromTo(
          "#mcp17-ok" + n,
          { opacity: 0, scale: 0.4 },
          { opacity: 1, scale: 1, duration: 0.3, ease: "expo.out" },
          at + run
        );
        flash("#mcp17-chip" + n, at + run, 0.5);
      }
      toolCall(1, 4.97, 0.3); // "review" 5.00 → tick 5.27
      toolCall(2, 5.07, 0.32); // tick 5.39 ("usage" 5.42)

      tl.fromTo(
        "#mcp17-result",
        { opacity: 0, y: 10 },
        { opacity: 1, y: 0, duration: 0.35, ease: "expo.out" },
        5.36
      );
      tl.fromTo(
        ".mcp17-res-row",
        { opacity: 0, x: -10 },
        { opacity: 1, x: 0, duration: 0.35, ease: "expo.out", stagger: 0.05 },
        5.4
      );
      tl.fromTo(
        ".mcp17-res-row .ak-meter > i",
        { scaleX: 0 },
        { scaleX: 1, duration: 0.45, ease: "expo.out", stagger: 0.05, transformOrigin: "0% 50%" },
        5.44
      );

      // "create offers" (5.84 / 6.17): create_offer ticks → dashboard updates
      toolCall(3, 5.74, 0.34); // tick 6.08

      // nav Offers count rolls 0 -> 1 with a neon wash
      tl.fromTo("#mcp17-navflash", { opacity: 0 }, { opacity: 1, duration: 0.15, ease: "power2.out" }, 6.06);
      tl.to("#mcp17-navflash", { opacity: 0.35, duration: 0.7, ease: "power2.out" }, 6.25);
      tl.fromTo("#mcp17-roll", { y: 0 }, { y: -17, duration: 0.4, ease: "expo.out" }, 6.08);
      tl.fromTo(
        "#mcp17-offcount",
        { color: "rgba(236, 236, 238, 0.68)" },
        { color: "#5fe3b1", duration: 0.3, ease: "power2.out" },
        6.08
      );

      // the new offer row slides into Recent activity
      tl.fromTo("#mcp17-recent-old", { y: 0 }, { y: 54, duration: 0.5, ease: "expo.out" }, 6.1);
      tl.fromTo(
        "#mcp17-act-new",
        { opacity: 0, x: -24 },
        { opacity: 1, x: 0, duration: 0.45, ease: "expo.out" },
        6.16
      );
      flash("#mcp17-act-new", 6.16, 0.6);
      // "incentives" (6.82): New tag pops
      tl.fromTo(
        "#mcp17-newtag",
        { opacity: 0, scale: 0.85 },
        { opacity: 1, scale: 1, duration: 0.3, ease: "expo.out" },
        6.72
      );
      flash("#mcp17-newtag", 6.72, 0.5);

      // "on the fly" (7.48): short confirmation
      tl.fromTo(
        "#mcp17-done",
        { opacity: 0, y: 10 },
        { opacity: 1, y: 0, duration: 0.4, ease: "expo.out" },
        7.36
      );
      tl.fromTo(
        "#mcp17-done svg",
        { scale: 0.5 },
        { scale: 1, duration: 0.4, ease: "expo.out" },
        7.36
      );
      flash("#mcp17-done svg", 7.36, 0.5);

      // ===== Beat 4 (7.8–9.76s): "grow revenue without growing your team" — hold =====
      tl.set({}, {}, 9.76);

      window.__timelines["17-dashboard-mcp"] = tl;
    })();
  </script>
