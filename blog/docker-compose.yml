# Optional: run the blog's auth + posts on Postgres instead of SQLite.
#   pnpm db:postgres   (or docker compose up -d)
#   DATABASE_URL=postgres://postgres:postgres@localhost:5434/blog pnpm dev
# Port 5434 so it doesn't clash with the Offer API's Postgres on 5432.
services:
  postgres:
    image: postgres:17-alpine
    environment:
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: blog
    ports:
      - "5434:5432"
    volumes:
      - blog_postgres:/var/lib/postgresql/data

volumes:
  blog_postgres:
