# Local Offer API: Postgres plus the API in watch mode on http://localhost:6767.
# `pnpm dev:api` (or `docker compose up`), then `pnpm dev:app`. The API's development
# defaults (src/dev-env.ts) match the dashboard's, so neither needs a .env.
services:
  postgres:
    image: postgres:17-alpine
    environment:
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: offersdk
    ports:
      - "5432:5432"
    volumes:
      - postgres:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD", "pg_isready", "-U", "postgres"]
      interval: 2s
      retries: 15

  api:
    image: oven/bun:1-alpine
    working_dir: /app
    command: sh -c "bun install && bun --watch src/index.ts"
    environment:
      DATABASE_URL: postgres://postgres:postgres@postgres:5432/offersdk
    ports:
      - "6767:6767"
    volumes:
      - ./api:/app
      - api_node_modules:/app/node_modules
    depends_on:
      postgres:
        condition: service_healthy

volumes:
  postgres:
  api_node_modules:
